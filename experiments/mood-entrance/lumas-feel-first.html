*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1A1916; --warm-white: #FAF9F6; --mid: #8A8880;
  --hairline: rgba(26,25,22,0.15);
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
}
html, body { width:100%; height:100%; overflow:hidden; background:#080807; color:#FAF9F6; font-family:'Archivo',sans-serif; cursor:none; }

/* Cursor */
#cursor { position:fixed; width:8px; height:8px; border-radius:50%; background:#FAF9F6; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:width .35s var(--ease),height .35s var(--ease),opacity .3s; mix-blend-mode:difference; }
#cursor.large { width:44px; height:44px; }

/* Stage */
#stage { position:fixed; inset:0; z-index:0; }
.art-frame { position:absolute; inset:0; opacity:0; transition:opacity 2s var(--ease); will-change:opacity,transform; }
.art-frame.active { opacity:1; }
.art-frame canvas { position:absolute; inset:0; width:100%; height:100%; }

/* Overlays */
#vignette { position:fixed; inset:0; background:radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(0,0,0,.72) 100%); pointer-events:none; z-index:10; }
#grain { position:fixed; inset:0; z-index:6; pointer-events:none; opacity:.028; }
#mood-bg { position:fixed; inset:0; z-index:1; opacity:0; transition:background 2.4s var(--ease),opacity 1.8s var(--ease); }
#blackout { position:fixed; inset:0; z-index:600; background:#080807; opacity:1; pointer-events:none; transition:opacity .7s var(--ease); }
#blackout.clear { opacity:0; }

/* Wordmark */
#wordmark { position:fixed; top:34px; left:50%; transform:translateX(-50%); z-index:200; font-family:'Archivo',sans-serif; font-weight:300; font-size:11px; letter-spacing:.46em; text-transform:uppercase; color:rgba(250,249,246,.55); opacity:0; transition:opacity 1.2s var(--ease); }
#wordmark.visible { opacity:1; }

/* Opening */
#opening { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 1s var(--ease); }
#question-wrap { text-align:center; opacity:0; transform:translateY(14px); transition:opacity 1.6s var(--ease),transform 1.6s var(--ease); }
#question-wrap.visible { opacity:1; transform:translateY(0); }
#question { font-family:'UtileDisplay',serif; font-weight:400; font-style:normal; font-size:clamp(26px,4.2vw,58px); letter-spacing:.005em; line-height:1.28; color:#FAF9F6; text-shadow:0 2px 60px rgba(0,0,0,.5); }
#emotions-wrap { margin-top:clamp(44px,7vh,72px); opacity:0; transition:opacity 1.4s var(--ease); }
#emotions-wrap.visible { opacity:1; }
#emotions { display:flex; gap:clamp(20px,3.5vw,52px); flex-wrap:wrap; justify-content:center; padding:0 24px; }
.emotion-word { font-family:'Archivo',sans-serif; font-weight:200; font-size:clamp(10px,1.2vw,14px); letter-spacing:.24em; text-transform:uppercase; color:rgba(250,249,246,.5); cursor:none; position:relative; padding:10px 0; transition:color .6s var(--ease); opacity:0; transform:translateY(10px); transition:opacity .8s var(--ease),transform .8s var(--ease),color .5s; }
.emotion-word::after { content:''; position:absolute; bottom:0; left:0; width:0; height:1px; background:#FAF9F6; transition:width .5s var(--ease); }
.emotion-word:hover { color:#FAF9F6; }
.emotion-word:hover::after { width:100%; }
.emotion-word.lit { opacity:1; transform:translateY(0); }

/* Index hint */
#index-hint { position:fixed; bottom:30px; right:38px; z-index:200; font-family:'Archivo',sans-serif; font-weight:300; font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:rgba(250,249,246,.22); opacity:0; cursor:none; transition:opacity .7s,color .4s; }
#index-hint.visible { opacity:1; }
#index-hint:hover { color:rgba(250,249,246,.65); }

/* Threshold */
#threshold { position:fixed; inset:0; z-index:160; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; transition:opacity .3s; }
#threshold.active { opacity:1; }
#threshold-word { font-family:'UtileDisplay',serif; font-weight:400; font-size:clamp(56px,11vw,150px); letter-spacing:-.02em; color:#FAF9F6; transform:scale(.93); opacity:0; transition:transform .75s var(--ease),opacity .55s var(--ease); }
#threshold.active #threshold-word { opacity:1; transform:scale(1); }

/* Corridor */
#corridor { position:fixed; inset:0; z-index:150; overflow-y:scroll; overflow-x:hidden; opacity:0; pointer-events:none; }
#corridor.active { opacity:1; pointer-events:all; }
#corridor-inner { position:relative; width:100%; padding-bottom:25vh; }

/* Corridor header */
#corridor-header { position:fixed; top:0; left:0; right:0; z-index:170; padding:26px 40px; display:flex; justify-content:space-between; align-items:center; opacity:0; pointer-events:none; transition:opacity .9s var(--ease); background:linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 100%); }
#corridor-header.active { opacity:1; pointer-events:all; }
#corridor-mood-label { font-family:'Archivo',sans-serif; font-weight:200; font-size:9px; letter-spacing:.44em; text-transform:uppercase; color:rgba(250,249,246,.38); }
#corridor-back { font-family:'Archivo',sans-serif; font-weight:300; font-size:9px; letter-spacing:.32em; text-transform:uppercase; color:rgba(250,249,246,.3); cursor:none; transition:color .4s; position:relative; padding:4px 0; }
#corridor-back::after { content:''; position:absolute; bottom:0; left:0; width:0; height:1px; background:rgba(250,249,246,.5); transition:width .45s var(--ease); }
#corridor-back:hover { color:rgba(250,249,246,.8); }
#corridor-back:hover::after { width:100%; }

/* Corridor slots */
.corridor-slot { position:relative; width:100%; display:flex; align-items:center; overflow:hidden; }
.slot-wrap { position:relative; overflow:hidden; cursor:none; }
.slot-wrap canvas { display:block; }
.artwork-info { position:absolute; bottom:24px; left:36px; right:36px; display:flex; justify-content:space-between; align-items:flex-end; opacity:0; transition:opacity 1.4s var(--ease); pointer-events:none; }
.artwork-info.revealed { opacity:1; }
.ai-artist { font-family:'Archivo',sans-serif; font-weight:200; font-size:9px; letter-spacing:.38em; text-transform:uppercase; color:rgba(250,249,246,.45); }
.ai-title { font-family:'UtileDisplay',serif; font-weight:300; font-style:normal; font-size:clamp(13px,1.8vw,20px); letter-spacing:.01em; color:rgba(250,249,246,.75); text-align:right; max-width:45%; }
.corridor-gap { width:100%; }

/* Deepen */
#deepen-hint { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:180; text-align:center; opacity:0; pointer-events:none; transition:opacity 1.2s var(--ease); }
#deepen-hint.active { opacity:1; pointer-events:all; cursor:none; }
#deepen-label { font-family:'Archivo',sans-serif; font-weight:200; font-size:9px; letter-spacing:.38em; text-transform:uppercase; color:rgba(250,249,246,.28); margin-bottom:10px; transition:color .4s; display:block; }
#deepen-hint:hover #deepen-label { color:rgba(250,249,246,.65); }
.drip-line { display:flex; flex-direction:column; align-items:center; gap:2px; }
.drip-line span { display:block; width:1px; background:rgba(250,249,246,.2); animation:drip 2.2s ease-in-out infinite; }
.drip-line span:nth-child(1) { height:14px; animation-delay:0s; }
.drip-line span:nth-child(2) { height:9px; animation-delay:.18s; }
.drip-line span:nth-child(3) { height:5px; animation-delay:.36s; }
@keyframes drip { 0%,100%{opacity:.18;transform:scaleY(1)} 50%{opacity:.75;transform:scaleY(1.25)} }

/* Expand overlay */
#expand-overlay { position:fixed; inset:0; z-index:300; opacity:0; pointer-events:none; transition:opacity .9s var(--ease); display:flex; }
#expand-overlay.active { opacity:1; pointer-events:all; }

#expand-close { position:absolute; top:26px; left:28px; font-family:'Archivo',sans-serif; font-weight:200; font-size:9px; letter-spacing:.32em; text-transform:uppercase; color:rgba(250,249,246,.3); cursor:none; transition:color .4s; }

// ── Grain ──────────────────────────────────────────────────
(function(){
  const gc = document.getElementById('grain-canvas');
  gc.width = 300; gc.height = 300;
  const gx = gc.getContext('2d');
  const id = gx.createImageData(300, 300);
  for (let i=0; i<id.data.length; i+=4) {
    const v = Math.random()*255|0;
    id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255;
  }
  gx.putImageData(id,0,0);
})();

  cursor.style.left = e.clientX + 'px';

});
function makeLarge(el) {
  el.addEventListener('mouseenter', () => cursor.classList.add('large'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('large'));
}

function seeded(seed) {
  let s = (seed * 9301 + 49297) % 233280;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };

// ── Painters ───────────────────────────────────────────────
function paintCalm(ctx, w, h, seed) {
  const r = seeded(seed);
  const hy = h * (.4 + r()*.18);
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0, `hsl(210,${16+r()*8}%,${70+r()*8}%)`);
  g.addColorStop(hy/h, `hsl(215,${12+r()*6}%,${60+r()*6}%)`);
  g.addColorStop(1, `hsl(220,${9+r()*5}%,${48+r()*8}%)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  // Horizon mist
  const mg = ctx.createRadialGradient(w*.5,hy,0,w*.5,hy,w*.7);
  mg.addColorStop(0,'rgba(255,255,255,.15)'); mg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=mg; ctx.fillRect(0,0,w,h);
  // Thin light bands
  for (let i=0;i<4;i++) {
    const y = hy*.2 + r()*hy*1.6;
    ctx.fillStyle=`rgba(255,255,255,${.02+r()*.04})`; ctx.fillRect(0,y,w,1+r());
  }
}

function paintPowerful(ctx, w, h, seed) {
  const r = seeded(seed);
  ctx.fillStyle='#0b0807'; ctx.fillRect(0,0,w,h);
  const cx = w*(.28+r()*.44); const fw = w*(.28+r()*.22);
  const g = ctx.createLinearGradient(cx-fw,0,cx+fw,0);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(.35,`rgba(${95+r()*35},${8+r()*12},${6+r()*6},.88)`);
  g.addColorStop(.65,`rgba(${75+r()*25},${6+r()*8},4,.78)`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  ctx.save(); ctx.translate(w*.5,h*.5); ctx.rotate(-.25+r()*.15);
  const sg=ctx.createLinearGradient(-w,-4,w,4);
  sg.addColorStop(0,'rgba(255,242,222,0)');
  sg.addColorStop(.5,`rgba(255,242,222,${.05+r()*.04})`);
  sg.addColorStop(1,'rgba(255,242,222,0)');
  ctx.fillStyle=sg; ctx.fillRect(-w,-80,w*2,160);
  ctx.restore();
}

function paintCurious(ctx, w, h, seed) {
  const r = seeded(seed);
  ctx.fillStyle='#161209'; ctx.fillRect(0,0,w,h);
  const gx=w*(.2+r()*.6), gy=h*(.2+r()*.6);
  const ag=ctx.createRadialGradient(gx,gy,0,gx,gy,w*.75);
  ag.addColorStop(0,`rgba(${175+r()*40},${95+r()*35},${18+r()*18},.42)`);
  ag.addColorStop(.55,'rgba(110,52,8,.14)');
  ag.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ag; ctx.fillRect(0,0,w,h);
  // Particle scatter
  for (let i=0;i<22;i++) {
    ctx.fillStyle=`rgba(${195+r()*55},${145+r()*55},${35+r()*35},${.08+r()*.18})`;
    ctx.beginPath(); ctx.arc(r()*w,r()*h,1+r()*2.5,0,Math.PI*2); ctx.fill();
  }
  // Luminous line
  ctx.strokeStyle=`rgba(215,162,50,${.07+r()*.06})`; ctx.lineWidth=.6;
  ctx.beginPath(); const ly=h*(.3+r()*.35);
  ctx.moveTo(0,ly);
  for (let x=0;x<w;x+=5) ctx.lineTo(x, ly+Math.sin(x*.018+r()*4)*18*r());
  ctx.stroke();
}

function paintSensual(ctx, w, h, seed) {
  const r = seeded(seed);
  ctx.fillStyle='#140a07'; ctx.fillRect(0,0,w,h);
  const cx=w*(.32+r()*.36), cy=h*(.28+r()*.38);
  const sg=ctx.createRadialGradient(cx,cy,0,cx,cy,w*.7);
  sg.addColorStop(0,`rgba(${195+r()*28},${118+r()*28},${72+r()*18},.52)`);
  sg.addColorStop(.42,'rgba(140,72,35,.22)');
  sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,w,h);
  const from = r()>.5?0:w;
  const shg=ctx.createLinearGradient(from,0,w-from,0);
  shg.addColorStop(0,'rgba(0,0,0,.62)'); shg.addColorStop(.55,'rgba(0,0,0,0)');
  ctx.fillStyle=shg; ctx.fillRect(0,0,w,h);
}

function paintDefiant(ctx, w, h, seed) {
  const r = seeded(seed);
  ctx.fillStyle='#040404'; ctx.fillRect(0,0,w,h);
  const lx=w*(r()*.45);
  const lg=ctx.createLinearGradient(lx,0,lx+w*.55,0);
  lg.addColorStop(0,`rgba(242,236,226,${.10+r()*.08})`);
  lg.addColorStop(.32,`rgba(242,236,226,${.04+r()*.04})`);
  lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,w,h);
  const sy=h*(.38+r()*.22);
  ctx.fillStyle=`rgba(238,232,220,${.06+r()*.04})`; ctx.fillRect(0,sy,w,.8+r()*.5);
  ctx.fillStyle=`rgba(238,232,220,${.035+r()*.025})`; ctx.fillRect(w*.18,sy+42+r()*55,w*.82,.4);
}

function paintNostalgic(ctx, w, h, seed) {
  const r = seeded(seed);
  const bg=ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,`hsl(34,${13+r()*9}%,${52+r()*9}%)`);
  bg.addColorStop(1,`hsl(29,${18+r()*9}%,${32+r()*9}%)`);
  ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
  // Grain
  const id=ctx.createImageData(w,h);
  for (let i=0;i<id.data.length;i+=4) {
    const v=(r()-.5)*38; const a=Math.abs(v)/380;
    id.data[i]=v>0?255:0; id.data[i+1]=v>0?238:0; id.data[i+2]=v>0?215:0; id.data[i+3]=a*255|0;
  }
  ctx.putImageData(id,0,0);
  const wg=ctx.createRadialGradient(w*(.38+r()*.22),h*(.28+r()*.18),0,w*.5,h*.5,w*.55);
  wg.addColorStop(0,`rgba(255,238,205,${.13+r()*.09})`); wg.addColorStop(1,'rgba(255,238,205,0)');
  ctx.fillStyle=wg; ctx.fillRect(0,0,w,h);
}

  const list = (ARTWORKS && ARTWORKS[mood]) || [];

  const idx = Math.abs(seed | 0) % list.length;

  frEl.dataset.meta = art.meta;
  frEl.dataset.price = art.price;
}

// ── Build corridor ─────────────────────────────────────────
function buildCorrider(mood, depth){ buildCorridor(mood, depth); } // alias
// ── Layout recipes: each mood is a different room ──────────
// Each recipe returns a layout spec per work {i,n}:
//   hF     height as fraction of viewport
//   wF     width as fraction of viewport
//   align  'left' | 'center' | 'right'
//   offset horizontal nudge in px (signed)
//   gap    space after this work in px
//   par    parallax factor (0 = locked, .15 = strong drift)
//   opacity 0..1 (for receding / fading effects)
//   overlap negative top margin in px (works bleed together)
//   rotate  subtle tilt in degrees (signed)

const LAYOUTS = {
  // CALM — one work at a time, perfectly centered, held still.
  // Vertical snap catches each piece; you cannot rush. Huge even air.
  // Movement grammar: paced, single-file, locked.
  calm(i, n){
    return { hF:.78, wF:.64, align:'center', offset:0, gap:'snap', par:0, opacity:1, overlap:0, fade:0 };
  },

  // POWERFUL — full-bleed wall of monumental works, almost touching.
  // Forward pressure, no pause, no daintiness.
  // Movement grammar: relentless forward push.
  powerful(i, n){
    return { hF:1, wF:1, align:'center', offset:0, gap:18, par:.0, opacity:1, overlap:0, fade:0 };
  },

  // CURIOUS — asymmetric scatter. Works land left / right at unpredictable
  // widths and heights, irregular gaps. The wander comes from POSITION,
  // never tilt. Movement grammar: the eye chases, never settles.
  curious(i, n){
    const hs = [.50, .74, .56, .82, .58, .70];
    const ws = [.40, .58, .46, .64, .44, .54];
    const al = ['left','right','left','right','center','left'];
    const of = [40, -60, 120, -90, 30, 150];
    const gp = [50, 150, 70, 170, 60, 110];
    return { hF:hs[i%6], wF:ws[i%6], align:al[i%6], offset:of[i%6],
             gap:gp[i%6], par:.07, opacity:1, overlap:0, fade:0 };
  },

  // SENSUAL — works bleed into one another, alternating sides, sliding
  // past at different speeds. Long slow gaps. No snap — boundless.
  // Movement grammar: slow drift, overlap, time stretches.
  sensual(i, n){
    const big = i % 2 === 0;
    return { hF:big?.90:.78, wF:big?.80:.60, align:i%2===0?'left':'right',
             offset:i%2===0?80:-80, gap:200, par:big?.06:.12,
             opacity:1, overlap:i===0?0:-Math.round(innerHeight*.13), fade:0 };
  },

  // DEFIANT — confrontational asymmetry. NEVER centered. Hard-left then
  // hard-right, abrupt scale jumps, tight clusters then a stark void.
  // Movement grammar: jolts, refusals, no comfort.
  defiant(i, n){
    const pat = [
      { hF:.92, wF:.78, align:'left',  offset:0,   gap:24 },
      { hF:.38, wF:.40, align:'right', offset:0,   gap:Math.round(innerHeight*.20) },
      { hF:.70, wF:.62, align:'right', offset:0,   gap:22 },
      { hF:.46, wF:.46, align:'left',  offset:0,   gap:Math.round(innerHeight*.16) },
      { hF:.96, wF:.86, align:'left',  offset:0,   gap:24 },
      { hF:.42, wF:.44, align:'right', offset:0,   gap:120 },
    ];
    const p = pat[i % pat.length];
    return { ...p, par:.03, opacity:1, overlap:0, fade:0 };
  },

  // NOSTALGIC — works recede: smaller, softer, and aged (desaturated /
  // warmed) the further back they sit. Carried by fade + age, NOT tilt,
  // NOT vignette. Movement grammar: memory slipping into distance.
  nostalgic(i, n){
    const t = n > 1 ? i / (n - 1) : 0;
    return { hF:.80 - t*.30, wF:.70 - t*.24, align:'center', offset:0,
             gap:100 + Math.round(t*60), par:.04, opacity:1 - t*.40,
             overlap:0, fade:t };
  },
};
function buildCorridor(mood, depth){
  const inner=document.getElementById('corridor-inner');
  inner.innerHTML='';
  const works=ARTWORKS[mood]||[];
  const corridorEl=document.getElementById('corridor');
  const vw=innerWidth, vh=innerHeight;
  const recipe = LAYOUTS[mood] || LAYOUTS.calm;
  const n = works.length;

  // CALM uses vertical scroll-snap: each work centers itself, one at a time.
  const useSnap = mood === 'calm';
  corridorEl.style.scrollSnapType = useSnap ? 'y mandatory' : 'none';

  works.forEach((work,i)=>{
    const L = recipe(i, n);
    const ch = Math.round(vh * L.hF);
    const cw = Math.round(vw * L.wF);
    const justify = L.align==='left'?'flex-start':L.align==='right'?'flex-end':'center';

    const slot=document.createElement('div');
    slot.className='corridor-slot';
    // For snap mode, slot is full viewport height so the work centers when caught.
    const slotH = useSnap ? vh : ch;
    let slotCss = `height:${slotH}px;justify-content:${justify};align-items:center;`;
    if(L.overlap) slotCss += `margin-top:${L.overlap}px;`;
    if(useSnap) slotCss += `scroll-snap-align:center;`;
    slot.style.cssText = slotCss;

    const wrap=document.createElement('div');
    wrap.className='slot-wrap';
    let wrapCss = `width:${cw}px;height:${ch}px;position:relative;overflow:hidden;`;
    if(L.offset) wrapCss += `margin-left:${L.offset>0?L.offset:0}px;margin-right:${L.offset<0?-L.offset:0}px;`;
    if(L.opacity<1) wrapCss += `opacity:${L.opacity.toFixed(3)};`;
    // NOSTALGIC: aged-photograph filter — desaturate + warm as the memory recedes.
    if(L.fade>0){
      const sat = (1 - L.fade*0.55).toFixed(3);
      const sep = (L.fade*0.45).toFixed(3);
      const bri = (1 - L.fade*0.12).toFixed(3);
      wrapCss += `filter:saturate(${sat}) sepia(${sep}) brightness(${bri});`;
    }
    wrap.style.cssText = wrapCss;
    wrap._pf = L.par;

    const img=document.createElement('img');
    img.className='slot-art';
    img.src=work.image;
    img.alt=`${work.artist} — ${work.title}`;
    img.loading='lazy';
    img.style.cssText=`width:${cw}px;height:${ch}px;display:block;object-fit:cover;background:${MOOD_BG[mood]||'#0a0a0a'};opacity:0;transition:opacity 1.2s var(--ease);`;
    img.onload=()=>{ img.style.opacity='1'; };
    const seed=depth*1000+i*137+mood.charCodeAt(0)*(depth+1)*7;

    const info=document.createElement('div');
    info.className='artwork-info';
    info.innerHTML=`<div class="ai-artist">${work.artist}</div><div class="ai-title">${work.title}</div>`;

    wrap.appendChild(img); wrap.appendChild(info);
    slot.appendChild(wrap); inner.appendChild(slot);

    // No gap elements in snap mode (full-height slots handle spacing).
    if(!useSnap && i<works.length-1 && typeof L.gap === 'number'){
      const gap=document.createElement('div');
      gap.className='corridor-gap';
      gap.style.height=`${L.gap}px`;
      inner.appendChild(gap);
    }

    wrap.addEventListener('click',()=>openExpand(work,mood,seed));
    makeLarge(wrap);
  });

  corridorEl.scrollTop=0;
  setupScroll();
}

// ── Corridor scroll ────────────────────────────────────────
let scrollRaf=null;
function setupScroll(){
  const c=document.getElementById('corridor');
  c.onscroll=()=>{ if(scrollRaf) cancelAnimationFrame(scrollRaf); scrollRaf=requestAnimationFrame(doScroll); };
}
function doScroll(){
  const vh=innerHeight;
  document.querySelectorAll('.corridor-slot').forEach(slot=>{
    const r=slot.getBoundingClientRect();
    const wrap=slot.querySelector('.slot-wrap');
    const info=slot.querySelector('.artwork-info');
    if(!wrap) return;
    const center=(r.top+r.height/2)-vh/2;
    wrap.style.transform=`translateY(${center*(wrap._pf||0)}px)`;
    const inView=r.top<vh*.88&&r.bottom>vh*.12;
    if(inView&&!info._shown){
      if(!info._t) info._t=setTimeout(()=>{ info.classList.add('revealed'); info._shown=true; },3000);
    } else if(!inView&&info._t&&!info._shown){
      clearTimeout(info._t); info._t=null;
    }
  });
}

// ── Return from corridor ───────────────────────────────────
document.getElementById('corridor-back').addEventListener('click',()=>{
  document.getElementById('corridor').classList.remove('active');
  document.getElementById('corridor').style.scrollSnapType='none';
  document.getElementById('corridor-header').classList.remove('active');
  document.getElementById('deepen-hint').classList.remove('active');
  document.getElementById('mood-bg').style.opacity='0';
  const op=document.getElementById('opening');
  op.style.opacity='1'; op.style.pointerEvents='all';
  document.getElementById('wordmark').style.opacity='1';
  document.getElementById('index-hint').classList.add('visible');
  document.getElementById('deepen-label').textContent='Deepen the mood';
  currentMood=null; currentDepth=0;
  startFrameCycle();
});

// ── Index ──────────────────────────────────────────────────
function openIndex(){
  const grid=document.getElementById('index-grid');
  grid.innerHTML='';
  Object.entries(ARTWORKS).forEach(([mood,works])=>{
    works.forEach((work,i)=>{
      const item=document.createElement('div');
      item.className='index-item';
      const c=document.createElement('img');
      c.src=work.image;
      c.alt=`${work.artist} — ${work.title}`;
      c.loading='lazy';
      c.style.cssText='width:100%;display:block;object-fit:cover;background:#0a0a0a;';
      c.style.aspectRatio='1 / 1.3';
      item.appendChild(c);
      const meta=document.createElement('div');
      meta.className='index-item-meta';
      meta.innerHTML=`<div class="iim-mood">${mood}</div><div class="iim-title">${work.title}</div>`;
      item.appendChild(meta);
      grid.appendChild(item);
      item.addEventListener('click',()=>{ closeIndex(); enterMood(mood); });
      makeLarge(item);
    });
  });
  document.getElementById('index-view').classList.add('active');
}
function closeIndex(){ document.getElementById('index-view').classList.remove('active'); }
document.getElementById('index-hint').addEventListener('click',openIndex);
document.getElementById('index-close').addEventListener('click',closeIndex);

document.addEventListener('keydown',e=>{
  if(e.key==='/'){ e.preventDefault(); document.getElementById('index-view').classList.contains('active')?closeIndex():openIndex(); }
  if(e.key==='Escape'){ document.getElementById('expand-overlay').classList.remove('active'); closeIndex(); }
});

// ── Resize ─────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  frames.forEach((f,i)=>paintFrame(f,stageMoods[i],i*137+42));
  if(currentMood) buildCorridor(currentMood,currentDepth);
});
</script>
