<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<script src="../assets/gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;700&display=swap" rel="stylesheet">
<!-- shared fonts live one level up, under onsite-alignment/assets -->
<link href="../assets/lumas-fonts.css" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart overlay page 2 — V2 branding conversion</title>
<style>

:root{
  --charcoal-900:#1C1A18; --charcoal-800:#3A3835; --charcoal-700:#5A5752;
  --charcoal-500:#908C87; --charcoal-300:#C7C3BE; --charcoal-100:#E3E0DB;
  --ivory-100:#F4EDE2;   --ivory-200:#F7F1E9;   --ivory-300:#FAF6F1;
  --bone-100:#E2D8CC;    --bone-200:#EAE2D8;    --bone-300:#F0EBE3;
  --success-600:#3A6B4A; --success-50:#E8F2EB;
  --warning-600:#9B6D1E; --warning-50:#FDF5E6;
  --error-600:#B5352A;   --error-50:#FDECEA;

  --color-text-primary:var(--charcoal-900);
  --color-text-secondary:var(--charcoal-700);
  --color-text-tertiary:var(--charcoal-500);
  --color-text-disabled:var(--charcoal-300);
  --color-text-inverse:var(--ivory-100);
  --color-surface-page:var(--ivory-300);
  --color-surface-card:#FFFFFF;
  --color-surface-raised:var(--ivory-200);
  --color-surface-sunken:var(--ivory-100);
  --color-surface-inverse:var(--charcoal-900);
  --color-surface-muted:var(--bone-300);
  --color-border-default:var(--bone-100);
  --color-border-subtle:var(--bone-200);
  --color-border-strong:var(--charcoal-300);
  --color-border-focus:var(--charcoal-900);
  --color-border-inverse:var(--ivory-100);
  --color-status-success:var(--success-600);
  --color-status-success-bg:var(--success-50);
  --color-status-warning:var(--warning-600);
  --color-status-warning-bg:var(--warning-50);
  --color-status-error:var(--error-600);
  --color-status-error-bg:var(--error-50);

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px; --sp-20:80px; --sp-24:96px;
  --radius-xs:2px; --radius-sm:4px;
  --shadow-sm:0 1px 2px rgba(28,26,24,.06);
  --shadow-md:0 2px 8px rgba(28,26,24,.08);
  --shadow-lg:0 8px 32px rgba(28,26,24,.12);
  --shadow-frame:0 18px 60px -16px rgba(28,26,24,.28);
  --font-display:'UtileDisplay',Georgia,serif;
  --font-ui:'Archivo',-apple-system,sans-serif;
  --zoom:1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-surface-page);color:var(--color-text-primary);
  font-family:var(--font-ui);font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit}

/* ── type tiers ────────────────────────────────────────────────── */
.d-h1{font-family:var(--font-display);font-weight:400;font-size:clamp(42px,6vw,62px);line-height:1.04}
.d-h2{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.12}
.d-h3{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.12}
.d-h4{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.25}
.b-lg{font-weight:300;font-size:20px;line-height:1.6}
.b{font-weight:400;font-size:16px;line-height:1.5}
.b-sm{font-weight:400;font-size:13px;line-height:1.65}
.cap{font-weight:400;font-size:11px;line-height:1.5;letter-spacing:.33px}
.micro{font-weight:400;font-size:10px;line-height:1.5}
.eyebrow{font-weight:700;font-size:11px;line-height:1.5;letter-spacing:1.98px;text-transform:uppercase}
.uilabel{font-weight:700;font-size:10px;line-height:1.5;letter-spacing:1.8px;text-transform:uppercase}
.t-sec{color:var(--color-text-secondary)} .t-ter{color:var(--color-text-tertiary)}
.bold{font-weight:700} .italic{font-style:italic}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── components ────────────────────────────────────────────────── */
.btn{display:block;width:100%;border:0;cursor:pointer;text-align:center;font-family:var(--font-ui);
  font-weight:700;font-size:13px;line-height:1.5;letter-spacing:1.82px;text-transform:uppercase;
  border-radius:var(--radius-xs);padding:var(--sp-4) 28px;transition:background .18s,color .18s}
.btn-primary{background:var(--color-surface-inverse);color:var(--color-text-inverse)}
.btn-primary:hover{background:var(--charcoal-800)}
.btn-secondary{background:transparent;color:var(--color-text-primary);border:1px solid var(--color-border-focus)}
.btn-secondary:hover{background:var(--color-surface-inverse);color:var(--color-text-inverse)}
.btn-ghost{display:inline-block;width:auto;background:none;border:0;
  border-bottom:1px solid var(--color-border-focus);padding:var(--sp-1) 0 6px;
  font-weight:400;letter-spacing:1.3px;color:var(--color-text-primary)}
.btn-ghost--inverse{color:var(--color-text-inverse);border-bottom-color:var(--color-border-inverse)}
.btn:disabled{background:var(--color-surface-muted);color:var(--color-text-disabled);cursor:not-allowed}
.btn-sm{padding:var(--sp-3) var(--sp-5);font-size:12px;letter-spacing:1.4px}

.chip{display:inline-block;padding:var(--sp-2) var(--sp-4);border-radius:var(--radius-xs);
  border:1px solid var(--color-border-strong);background:transparent;font-weight:700;font-size:12px;
  line-height:1.5;letter-spacing:.96px;text-transform:uppercase;color:var(--color-text-primary)}
.chip--active{background:var(--color-surface-inverse);color:var(--color-text-inverse);border-color:var(--color-surface-inverse)}
.chip--sm{padding:var(--sp-1) var(--sp-2);font-size:10px;letter-spacing:1.2px}

.field{display:flex;align-items:center;gap:var(--sp-2);border:1px solid var(--color-border-default);
  border-radius:var(--radius-sm);padding:13px 14px;background:var(--color-surface-card)}
.field input{border:0;outline:0;flex:1;min-width:0;font-family:var(--font-ui);font-size:14px;
  color:var(--color-text-primary);background:transparent}
.field input::placeholder{color:var(--color-text-tertiary)}
.field:focus-within{border-width:2px;border-color:var(--color-border-focus);padding:12px 13px}
.field--error{border-color:var(--color-status-error)}
.helper{font-size:11px;line-height:1.5;color:var(--color-text-tertiary);margin-top:var(--sp-2)}
.helper--error{color:var(--color-status-error)}

.icon-btn{background:none;border:0;cursor:pointer;color:var(--color-text-primary);
  display:inline-flex;align-items:center;position:relative;padding:var(--sp-1)}
.badge{position:absolute;top:-3px;right:-5px;min-width:16px;height:16px;border-radius:8px;
  background:var(--color-surface-inverse);color:var(--color-text-inverse);font-size:9px;font-weight:700;
  display:grid;place-items:center;padding:0 4px}
.remove{position:absolute;top:0;right:0;width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;
  background:var(--color-surface-inverse);color:var(--color-text-inverse);display:grid;place-items:center}

/* ── shop chrome ───────────────────────────────────────────────── */
.promo-dark{background:var(--color-surface-inverse);padding:var(--sp-3) var(--sp-6);
  display:flex;align-items:center;justify-content:center;gap:var(--sp-6)}
.promo-dark .eyebrow{color:var(--color-text-inverse)}
.promo-light{background:var(--color-surface-page);padding:var(--sp-3) var(--sp-10);text-align:center;position:relative}
.promo-light .ovc{position:absolute;top:50%;right:var(--sp-4);transform:translateY(-50%)}
.site-head{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-6);
  background:var(--color-surface-card);border-bottom:1px solid var(--color-border-subtle)}
.logo{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1;
  letter-spacing:.5px;display:inline-flex;align-items:flex-start;gap:2px}
.logo sup{font-size:9px;line-height:1}
.nav{display:flex;gap:var(--sp-5)}
.nav a{font-size:14px;color:var(--color-text-primary);text-decoration:none;cursor:pointer}
.nav a:hover{border-bottom:1px solid var(--color-border-focus)}

.trust-row{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--sp-4);
  padding:var(--sp-6);background:var(--color-surface-card);
  border-bottom:1px solid var(--color-border-subtle);text-align:center}
.trust-row .ic{display:grid;place-items:center;margin-bottom:var(--sp-2);color:var(--color-text-primary)}

/* ── PDP ───────────────────────────────────────────────────────── */
.size-row{display:flex;gap:var(--sp-2)}
.size-chip{flex:1;border:1px solid var(--color-border-strong);background:transparent;cursor:pointer;
  border-radius:var(--radius-xs);padding:var(--sp-2) var(--sp-1);text-align:center;
  font-family:var(--font-ui);color:var(--color-text-primary)}
.size-chip b{display:block;font-size:13px;font-weight:700;letter-spacing:.4px}
.size-chip span{display:block;font-size:10px;line-height:1.4;color:var(--color-text-tertiary);margin-top:2px}
.size-chip[aria-pressed="true"]{background:var(--color-surface-inverse);border-color:var(--color-surface-inverse);color:var(--color-text-inverse)}
.size-chip[aria-pressed="true"] span{color:rgba(244,237,226,.55)}
.select-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  border:1px solid var(--color-border-default);border-radius:var(--radius-sm);padding:14px;
  background:var(--color-surface-card);cursor:pointer;width:100%;text-align:left}
.select-row:hover{border-color:var(--color-border-strong)}
.gallery .main{background:var(--color-surface-page);position:relative;aspect-ratio:4/3;
  display:grid;place-items:center;overflow:hidden}
.gallery .main img{width:74%;box-shadow:var(--shadow-frame)}
.gallery .tool{position:absolute;background:var(--color-surface-card);border:1px solid var(--color-border-subtle);
  padding:var(--sp-2) var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);border-radius:var(--radius-xs)}
.thumbs{display:flex;gap:var(--sp-2);margin-top:var(--sp-3)}
.thumbs div{width:60px;aspect-ratio:1;background:var(--color-surface-page);border:1px solid var(--color-border-subtle);overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover}

/* ── cart / overlay ───────────────────────────────────────────── */
.ov-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-4);
  padding:var(--sp-6) var(--sp-6) var(--sp-5)}
.ov-body{padding:0 var(--sp-6) var(--sp-5)}
.ov-foot{padding:var(--sp-6);border-top:1px solid var(--color-border-subtle)}
/* The page ground is ivory/300, so the money block goes WHITE — at the bottom
   edge of the frame an ivory footer dissolved straight into the page behind it.
   Separation is the 1px hairline; the card stays lighter than its ground. */
.ov-foot--sunken{background:var(--color-surface-card)}
/* Green by decision: the returns promise keeps status/success as a conversion
   device, so this is a logged exception to "status colour is functional only". */
.reassure{display:flex;gap:var(--sp-3);align-items:flex-start;
  background:var(--color-status-success-bg);color:var(--color-status-success);
  padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4)}
.item{display:grid;grid-template-columns:96px 1fr;gap:var(--sp-4);padding:var(--sp-5) 0;
  border-bottom:1px solid var(--color-border-subtle);position:relative}
.item:last-of-type{border-bottom:0}
.item--lg{grid-template-columns:132px 1fr}
.thumb{background:var(--color-surface-page);border:1px solid var(--color-border-subtle);overflow:hidden;align-self:start}
.thumb img{width:100%;height:100%;object-fit:cover}
.item-meta{display:flex;flex-direction:column;gap:var(--sp-1);min-width:0;padding-right:var(--sp-6)}
.trustbox{display:flex;gap:var(--sp-3);border:1px solid var(--color-border-default);
  background:var(--color-surface-page);padding:var(--sp-3);margin-top:var(--sp-3)}
.sum{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-4);padding:var(--sp-1) 0}
.sum--total{border-top:1px solid var(--color-border-subtle);margin-top:var(--sp-2);
  padding-top:var(--sp-3);align-items:flex-end}
.sum .grand{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.12;flex:none}
.total-toggle{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);
  width:100%;background:none;border:0;cursor:pointer;color:var(--color-text-primary);text-align:left;
  border-top:1px solid var(--color-border-subtle);margin-top:var(--sp-2);padding:var(--sp-3) 0 0}
.total-toggle .lbl{flex:1;min-width:0}
.total-toggle svg{flex:none;margin-bottom:4px;color:var(--color-text-tertiary)}
.link{border-bottom:1px solid currentColor;cursor:pointer}
.foot-trust{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);
  margin-top:var(--sp-2);color:var(--color-text-tertiary)}

/* ── checkout ─────────────────────────────────────────────────── */
.pay-row{display:flex;gap:var(--sp-4)}
.pay{flex:1;display:grid;place-items:center;padding:14px var(--sp-3);border-radius:var(--radius-xs);
  border:1px solid transparent;cursor:pointer;font-family:var(--font-ui);font-weight:700;font-size:13px;
  letter-spacing:.4px;white-space:nowrap}
.pay:hover{filter:brightness(.94)}
/* provider marks keep their own branding — V2 governs LUMAS surfaces only */
.pay-paypal{background:#FFC439;color:#003087}
.pay-amazon{background:linear-gradient(#F9D262,#F0A93B);color:#111}
.pay-apple{background:#000;color:#fff}
.divider{display:flex;align-items:center;gap:var(--sp-4);margin:var(--sp-8) 0}
.divider::before,.divider::after{content:"";height:1px;background:var(--color-border-default);flex:1}
.tp{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:var(--sp-6);align-items:start;
  border-top:1px solid var(--color-border-subtle);margin-top:var(--sp-8);padding-top:var(--sp-8)}
.stars{display:flex;gap:2px;margin:var(--sp-2) 0}
.stars i{width:15px;height:15px;background:#00B67A;display:block}
.stars i::before{content:"★";color:#fff;font-size:11px;display:grid;place-items:center;height:100%}
.tp-verified{display:flex;align-items:center;gap:var(--sp-1);color:var(--color-text-secondary)}
.sum-line{display:flex;align-items:center;gap:var(--sp-2);color:var(--color-text-secondary);padding:var(--sp-1) 0}

/* ── skeletons / states ───────────────────────────────────────── */
.skel{position:relative;overflow:hidden;background:var(--color-surface-page)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:sweep 1.35s infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.skel-line{height:12px;border-radius:var(--radius-xs)}
.empty{padding:var(--sp-16) var(--sp-6);text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--sp-6)}
.band-error{display:flex;gap:var(--sp-3);background:var(--color-status-error-bg);color:var(--color-status-error);padding:var(--sp-4) var(--sp-6)}

/* ── frames: real device viewports ────────────────────────────────
   --vw / --vh are the VISIBLE viewport (device CSS px minus browser
   chrome). Surfaces are clipped to it, so anything that would need a
   scroll is immediately obvious instead of hidden by an infinite page. */
.mob{width:var(--vw,390px);height:var(--vh,auto);background:var(--color-surface-card);
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.mob > *{flex:none}
.exit-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);
  padding:var(--sp-3) var(--sp-6);border-bottom:1px solid var(--color-border-subtle)}
.mob[data-tight] .exit-bar,.desk[data-tight] .exit-bar{padding:var(--sp-2) var(--sp-5)}
.mob[data-tight] .ov-head{padding-top:var(--sp-3)}
.mob .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.desk{width:1440px;height:var(--dvh,auto);background:var(--color-surface-page);
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.desk > *{flex:none}
.desk .scroll{flex:1 1 auto;min-height:0;overflow-y:auto}
.desk .pdp{flex:1 1 auto;min-height:0;overflow:hidden}
.deskwrap{zoom:var(--zoom)}
.fitbar{display:flex;align-items:center;gap:var(--sp-3);justify-content:center;font-family:var(--font-ui);
  font-weight:700;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--color-text-tertiary)}
.fitbar b{color:var(--color-text-primary)}
.fitbar .ok{color:var(--color-status-success)}
.fitbar .warn{color:var(--color-status-warning)}
/* the overlay's decision layer must survive the smallest viewport */
.mob .ov-body,.panel .ov-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.mob[data-tight] .ov-head{padding:var(--sp-4) var(--sp-5) var(--sp-3)}
.mob[data-tight] .ov-body{padding:0 var(--sp-5) var(--sp-3)}
.mob[data-tight] .ov-foot{padding:var(--sp-4) var(--sp-5)}
.mob[data-tight] .item{padding:var(--sp-3) 0;grid-template-columns:72px 1fr}
.mob[data-tight] .item--lg{grid-template-columns:88px 1fr}
.mob[data-tight] .reassure{padding:var(--sp-2) var(--sp-4);margin-bottom:var(--sp-3)}
.mob[data-tight] .sum .grand{font-size:22px}
/* the PDP behind the sheet clips; the sheet never exceeds 82% of the viewport */
.peek{flex:1 1 auto;min-height:0;overflow:hidden;border-bottom:1px solid var(--color-border-subtle)}
/* the sheet takes what it needs; the page behind it gets the remainder */
.sheet{flex:none;max-height:98%;display:flex;flex-direction:column;min-height:0;
  background:var(--color-surface-card);box-shadow:0 -8px 32px rgba(28,26,24,.10)}
.mob[data-compact] .sheet{max-height:98%}
.sheet--only{max-height:100%;flex:1 1 auto;box-shadow:none}
/* two lines of spec is enough on a phone; the full string lives on the PDP */
.mob[data-tight] .item-meta .b-sm,.panel .item-meta .b-sm{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mob[data-tight] .reassure .b-sm{font-size:12px;line-height:1.5}
.panel .item{grid-template-columns:72px 1fr;padding:var(--sp-3) 0}
/* the drawer pays for its exit bar out of row rhythm, not out of content */
.drawer .item{padding:var(--sp-2) 0}
.drawer .ov-head{padding:var(--sp-4) var(--sp-5) var(--sp-3)}
.drawer .ov-body{padding:0 var(--sp-5) var(--sp-3)}
.drawer .ov-foot{padding:var(--sp-4) var(--sp-5)}
/* the compact panel drops the returns promise — the footer trust line carries
   reassurance, and 48px is the difference between fitting and not */
.panel .reassure{display:none}
/* last 40px: shave the rhythm, never the CTA */
.mob[data-tight] .item{padding:var(--sp-2) 0}
.mob[data-tight] .reassure{margin-bottom:var(--sp-2)}
.mob[data-tight] .trustbox{padding:var(--sp-2);margin-top:var(--sp-2)}
.mob[data-tight] .btn-primary{margin-top:var(--sp-5) !important}
.mob[data-tight] .ov-foot{padding:var(--sp-3) var(--sp-5)}
/* 1280×689 laptops: the drawer and panel get the same treatment */
.desk[data-tight] .drawer .item,.desk[data-tight] .panel .item{padding:var(--sp-1) 0}
.desk[data-tight] .drawer .ov-head,.desk[data-tight] .panel .ov-head{padding:var(--sp-4) var(--sp-5) var(--sp-3)}

/* the five total-disclosure treatments — the actual subject of page 2 */
function disclosure(kind, total = T.total) {
  const grand = (label, value) => `
    <div class="sum sum--total">
      <p class="b-sm bold">${label}</p>
      <p class="grand num">${value}</p>
    </div>`;

  if (kind === 'A') return `
    ${grand(T.totalPlain, total)}
    <p class="cap t-ter">${T.localShippingNote}</p>`;

  if (kind === 'B') return `
    ${grand(T.totalPlain, total)}
    <p class="b-sm t-sec" style="display:flex;gap:var(--sp-2);margin-top:var(--sp-2)">
      <span style="flex:none;color:var(--color-text-primary)">${ICON.shield}</span>
      <span><span class="bold" style="color:var(--color-text-primary)">${T.insuredBold}</span> ${T.insuredRest}</span>
    </p>`;

  if (kind === 'C') return `
    ${grand(T.totalPlain, total)}
    <div class="trustbox">
      <span style="flex:none">${ICON.shield}</span>
      <p class="b-sm t-sec">
        <span class="bold" style="color:var(--color-text-primary)">${T.trustBoxBold}</span>${T.trustBoxRest}
        <span class="link" onclick="track('select_content',{content_type:'shipping_details'})">${T.shippingDetails}</span>
      </p>
    </div>`;

  if (kind === 'D') return `
    <button class="total-toggle" onclick="track('select_content',{content_type:'total_breakdown_expand'})">
      <span class="b-sm bold lbl">${T.totalWithShipping}</span>
      <span class="grand num">${total}</span>${ICON.chevD}
    </button>`;

  return `
    <div class="sum"><p class="b-sm">${T.subtotalLabel}</p><p class="b-sm num">${T.subtotal}</p></div>
    <div class="sum">
      <p class="b-sm">${T.shippingLabel}
        <span class="cap link" onclick="track('select_content',{content_type:'shipping_details'})">${T.shippingDetails}</span>
      </p>
      <p class="b-sm num">${T.shipping}</p>
    </div>
    <button class="total-toggle" onclick="track('select_content',{content_type:'total_breakdown_collapse'})">
      <span class="b-sm bold lbl">${T.totalWithShipping}</span>
      <span class="grand num">${total}</span>${ICON.chevU}
    </button>`;
}

/* ── controller ───────────────────────────────────────────────── */
const SURFACES = [
  ['mob-sheet', 'Cart layer',      mobileSheetOnly,   true],
  ['mob-pdp',   'Mobile PDP',      mobilePdpOverlay,  true],
  ['mob-page',  'Mobile page',     mobilePageOverlay, true],
  ['desk-draw', 'Desktop drawer',  desktopDrawer,     true],
  ['desk-panel','Desktop panel',   desktopPanel,      true],
  ['mob-cart',  'Mobile cart',     mobileCart,        true],
  ['desk-check','Desktop checkout',desktopCheckout,   false]
];
const DISCLOSURES = [
  ['A','A local note'], ['B','B insured'], ['C','C trust box'],
  ['D','D collapsed'],  ['E','E breakdown']
];
const STATES = [['default','Default'],['loading','Loading'],['empty','Empty'],['error','Error']];

/* ── real device viewports ───────────────────────────────────────
   vh = visible viewport: device CSS height minus browser chrome. */
const DEVICES = {
  mobile: [
    { id:'se',   label:'iPhone SE',   w:375,  h:667,  vh:553 },
    { id:'i15',  label:'iPhone 15',   w:390,  h:844,  vh:734 },
    { id:'px7',  label:'Pixel 7',     w:412,  h:915,  vh:787 },
    { id:'mfull',label:'Full height', w:390,  h:844,  vh:0   }
  ],
  desktop: [
    { id:'mba13',label:'MacBook 13"', w:1440, h:900,  vh:789 },
    { id:'lap',  label:'1280×800',    w:1280, h:800,  vh:689 },
    { id:'wide', label:'1920×1080',   w:1920, h:1080, vh:969 },
    { id:'dfull',label:'Full height', w:1440, h:900,  vh:0   }
  ]
};
const isDesktop = s => s.startsWith('desk');
const deviceList = () => DEVICES[isDesktop(state.s) ? 'desktop' : 'mobile'];
const device = () => deviceList().find(d => d.id === state.dev) || deviceList()[0];

/* attributes for a mobile frame: viewport size + compaction tier */
function frameAttrs() {
  const d = device();
  const tier = !d.vh ? '' : d.vh < 620 ? ' data-compact data-tight' : d.vh < 800 ? ' data-tight' : '';
  return `${tier} style="--vw:${d.w}px;--vh:${d.vh ? d.vh + 'px' : 'auto'}"`;
}

/* same idea for the 1440/1280 desktop frames */
function deskAttrs() {
  const d = device();
  const tier = d.vh && d.vh < 760 ? ' data-tight' : '';
  return `${tier} style="--dvh:${d.vh ? d.vh + 'px' : 'auto'}"`;
}

const p = new URLSearchParams(location.search);
const state = {
  s:  SURFACES.some(x => x[0] === p.get('s'))    ? p.get('s')  : 'mob-pdp',
  d:  DISCLOSURES.some(x => x[0] === p.get('d')) ? p.get('d')  : 'E',
  st: STATES.some(x => x[0] === p.get('st'))     ? p.get('st') : 'default',
  dev: p.get('dev') || 'i15',
  notes: p.get('notes') === '1'
};

let renderToken = 0;
if (p.get('chrome') === '0') document.body.classList.add('bare');

/* How much of the DECISION layer is out of view. The page behind a sheet
   (.peek) is meant to clip, so it is reported separately, not as a failure. */
function fitBar(root, label) {
  const d = device();
  if (!d.vh) return `<p class="fitbar">${label} · ${d.w}×${d.h} — unclipped</p>`;
  const regions = [...root.querySelectorAll('.ov-body,.scroll')];
  const over = regions.reduce((m, el) => Math.max(m, el.scrollHeight - el.clientHeight), 0);
  const isSheet = !!root.querySelector('.sheet,.drawer,.panel');
  const peekEl = root.querySelector('.peek');
  const peek = peekEl ? Math.max(0, peekEl.scrollHeight - peekEl.clientHeight) : 0;
  const verdict = over <= 2
    ? '<span class="ok">fits — no scrolling</span>'
    : `<span class="warn">${over}px ${isSheet ? 'scrolls in the item list' : 'below the fold · total + CTA pinned'}</span>`;
  const behind = peek ? ` · page behind clipped ${peek}px (by design)` : '';
  return `<p class="fitbar">${label} · <b>${d.w}×${d.vh}</b> visible — ${verdict}${behind}</p>`;
}

function seg(id, options, key) {
  document.getElementById(id).innerHTML = options.map(([val, label]) =>
    `<button aria-pressed="${state[key] === val}" data-key="${key}" data-val="${val}">${label}</button>`).join('');
}

function render() {
  const surface = SURFACES.find(x => x[0] === state.s);
  const stage = document.getElementById('stage');
  /* keep the device selection valid when switching between mobile and desktop */
  if (!deviceList().some(x => x.id === state.dev)) state.dev = deviceList()[0].id;

  stage.innerHTML = `<div class="cmp">${surface[2](state.d, state.st)}</div>`;

  /* fit the desktop frame's own width to the browser window */
  const wrap = stage.querySelector('.deskwrap');
  if (wrap) wrap.style.setProperty('--zoom', Math.min(1, (window.innerWidth - 96) / device().w).toFixed(3));

  const token = ++renderToken;
  /* setTimeout, not requestAnimationFrame: rAF is throttled to a standstill
     in offscreen iframes, which is exactly how the board page embeds this. */
  setTimeout(() => {
    if (token !== renderToken) return;
    const cmp = stage.querySelector('.cmp');
    const frame = cmp && cmp.querySelector('.mob,.desk');
    if (!cmp || !frame) return;
    cmp.querySelectorAll('.fitbar').forEach(el => el.remove());
    cmp.insertAdjacentHTML('beforeend', fitBar(frame, `${surface[1]} · ${device().label}`));
  });

  seg('seg-surface', SURFACES.map(s => [s[0], s[1]]), 's');
  seg('seg-device', deviceList().map(d => [d.id, d.label]), 'dev');
  seg('seg-disclosure', DISCLOSURES, 'd');
  seg('seg-state', STATES, 'st');
  document.getElementById('seg-notes').innerHTML =
    `<button aria-pressed="${state.notes}" data-key="notes" data-val="toggle">V2 notes</button>`;
  /* the checkout surface has its own fixed summary — disclosure does not apply */
  if (!surface[3]) document.querySelectorAll('#seg-disclosure button').forEach(b => b.disabled = true);

  document.getElementById('notes').hidden = !state.notes;
  const q = new URLSearchParams({ s: state.s, d: state.d, st: state.st, dev: state.dev });
  if (state.notes) q.set('notes', '1');
  history.replaceState(null, '', '?' + q);
  track('view_cart', { surface: state.s, disclosure: state.d, ui_state: state.st });
}

document.querySelector('.chrome').addEventListener('click', e => {
  const b = e.target.closest('button[data-key]');
  if (!b || b.disabled) return;
  if (b.dataset.key === 'notes') state.notes = !state.notes;
  else state[b.dataset.key] = b.dataset.val;
  render();
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 's') { const i = SURFACES.findIndex(x => x[0] === state.s); state.s = SURFACES[(i+1) % SURFACES.length][0]; render(); }
  if (e.key === 'd') { const i = DISCLOSURES.findIndex(x => x[0] === state.d); state.d = DISCLOSURES[(i+1) % DISCLOSURES.length][0]; render(); }
  if (e.key === 'n') { state.notes = !state.notes; render(); }
});
window.addEventListener('resize', () => {
  const wrap = document.querySelector('.deskwrap');
  if (wrap) wrap.style.setProperty('--zoom', Math.min(1, (window.innerWidth - 96) / 1440).toFixed(3));
});
