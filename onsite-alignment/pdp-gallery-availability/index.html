<!doctype html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liu von Marta Contreras Simó — LUMAS</title>
<meta name="description" content="Liu by Marta Contreras Simó. Limited Edition 150, signed. Gallery availability for your exact size and framing.">
<link rel="preconnect" href="https://img.lumas.com" crossorigin>
<link rel="preload" as="image" href="https://img.lumas.com/showimg_mcs13_full.jpg" fetchpriority="high">
<style>
@view-transition { navigation: auto; }

@font-face{font-family:'archivo';src:url('../assets/fonts/archivo.woff2') format('woff2-variations'),url('../assets/fonts/archivo.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'utile-display';src:url('../assets/fonts/utile/utile-display-light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'utile-display';src:url('../assets/fonts/utile/utile-display-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}

/* Tokens read off the live LUMAS PDP (www.lumas.de/pictures/marta_contreras_simo/liu/) */
:root{
  --ink:#1C1A18;          /* text primary, borders, CTA fill      */
  --ink-soft:#5C5C5C;     /* inactive size label                  */
  --ink-mute:#6E6A65;
  --page:#fff;
  --band:#F7F1E9;         /* demand-indicator background          */
  --stage:#E2D8CC;        /* .image-wrapper background            */
  --line:#C7C3BE;
  --line-2:#E2D8CC;
  --sunken:#F0EBE3;
  --cta-text:#F4EDE2;
  --ease:cubic-bezier(.2,.8,.2,1);--t1:200ms;--t2:320ms;
  --drawer-w:400px;
  --promo-h:46px;--hdr-h:70px;--buy-w:clamp(470px,30vw,600px);
  --pad:clamp(12px,1.4vw,28px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:'archivo',arial,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer}
h1,h2,h3,p,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.b{font-weight:700}
svg.ico{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
svg.ico-s{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ── promo bar ───────────────────────────────────────── */
.promo{height:var(--promo-h);background:var(--ink);color:var(--cta-text);display:flex;align-items:center;
  justify-content:center;gap:24px;padding:0 46px 0 var(--pad);position:relative;font-size:13px;font-weight:700}
.promo-cta{border:1px solid rgba(244,237,226,.85);padding:8px 18px;font-size:11px;font-weight:700;
  letter-spacing:1.68px;text-transform:uppercase;transition:background var(--t1) var(--ease)}
.promo-cta:hover{background:rgba(244,237,226,.12)}
.promo-x{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center}
body[data-promo="0"] .promo{display:none}

/* ── header ──────────────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:60;background:var(--page)}
.hdr-in{height:var(--hdr-h);display:flex;align-items:center;gap:clamp(14px,2vw,30px);padding:0 var(--pad);
  transition:padding-right var(--t2) var(--ease)}
.logo{width:118px;flex:none;color:var(--ink)}
.logo svg{width:100%;height:auto;display:block}
.nav{display:flex;gap:clamp(12px,1.6vw,24px);font-weight:700;font-size:15px;white-space:nowrap}
.nav a{padding:4px 0;border-bottom:1px solid transparent;transition:border-color var(--t1) var(--ease)}
.nav a:hover{border-color:var(--ink)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--sunken);border-radius:20px;
  height:34px;padding:0 14px;width:clamp(160px,20vw,282px);color:var(--ink-mute);font-size:15px}
.search input{border:0;background:none;outline:0;font:inherit;color:var(--ink);width:100%}
.hdr-r{display:flex;align-items:center;gap:2px}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:2px;transition:background var(--t1) var(--ease)}
.ib:hover{background:var(--sunken)}
.hdr-rule{height:1px;background:var(--line-2)}

/* ── shell / push drawer ─────────────────────────────── */
.shell{transition:padding-right var(--t2) var(--ease)}
@media(min-width:1180px){
  body.drawer-open .shell{padding-right:var(--drawer-w)}
  body.drawer-open .hdr-in{padding-right:calc(var(--pad) + var(--drawer-w))}
  body.drawer-open .search{display:none}
}

/* ── hero ────────────────────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,var(--buy-w));gap:clamp(18px,2vw,34px);
  padding:0 var(--pad) 40px;align-items:start}
@media(max-width:1023px){ .hero{grid-template-columns:minmax(0,1fr);gap:0;padding:0 0 24px} }

.stage-col{min-width:0}
.stage-bar{display:none;align-items:center;gap:9px;padding:13px 18px;background:var(--band);
  font-size:11px;letter-spacing:1px;color:var(--ink);box-shadow:inset 3px 0 0 var(--ink);min-width:0}
.stage-bar .sdot{width:8px;height:8px;border-radius:50%;background:#2D6A31;flex:none}
.stage-bar[data-in="0"] .sdot{background:var(--line)}
.stage-bar .lbl{font-weight:700;text-transform:uppercase;white-space:nowrap}
.stage-bar .meta{color:var(--ink-soft);text-transform:uppercase;white-space:nowrap;min-width:0;
  overflow:hidden;text-overflow:ellipsis}
.stage-bar .sep{font-style:normal;color:rgba(28,26,24,.32);flex:none}
.stage-bar .g-short{display:none}
.stage-bar .dir{margin-left:auto;flex:none;font-weight:700;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:2px;transition:border-color var(--t1) var(--ease)}
.stage-bar .dir:hover{border-color:var(--ink)}

/* stage, mirrors .image-wrapper on the live PDP */
.stage{position:relative;background:var(--stage) url('assets/pdp-background.jpg') center/cover;
  min-height:0;display:grid;place-items:center;min-width:0;
  --stage-pad:clamp(24px,3vw,42px);
  padding:var(--stage-pad) var(--stage-pad) calc(var(--stage-pad) + 50px)}
.artwrap{width:min(100%,min(64vh,720px));aspect-ratio:1/1;display:grid;place-items:center}
.frame{width:100%;height:100%;position:relative;display:grid;place-items:center;
  transition:padding var(--t2) var(--ease),background var(--t2) var(--ease),box-shadow var(--t2) var(--ease)}
.frame .inner{width:100%;height:100%;display:grid;place-items:center;transition:padding var(--t2) var(--ease),background var(--t2) var(--ease)}
.frame img{width:100%;height:100%;object-fit:contain}
.frame::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity var(--t2) var(--ease);
  background:linear-gradient(118deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 36%)}
.frame[data-gloss="1"]::after{opacity:1}
.frame[data-frame="none"]{box-shadow:0 14px 44px -18px rgba(28,26,24,.42)}
.frame[data-frame="framed"]{box-shadow:0 18px 50px -18px rgba(28,26,24,.45)}

.view{display:none;width:100%;justify-content:center}
.stage[data-view="work"] .view-work,
.stage[data-view="kitchen"] .view-kitchen,
.stage[data-view="living"] .view-living,
.stage[data-view="ar"] .view-ar,
.stage[data-view="cert"] .view-cert,
.stage[data-view="corner"] .view-corner,
.stage[data-view="back"] .view-back{display:flex}
.roombox{position:relative;width:100%;max-width:1100px;aspect-ratio:1920/1161;background:var(--sunken);overflow:hidden}
.roombox > img.bg{width:100%;height:100%;object-fit:cover}
.roombox > .hang{position:absolute;left:34%;top:41%;width:17%;box-shadow:0 14px 34px -14px rgba(0,0,0,.55)}
.roombox > .hang img{width:100%;display:block}
.flat{max-width:820px;width:100%}
.flat img{width:100%;height:auto;object-fit:contain}
.view-ar .flat{max-width:340px}

.thumbs{display:flex;gap:8px;padding:10px 0 0;flex-wrap:wrap}
.thumb{width:74px;height:74px;flex:none;border:1px solid var(--line-2);background:var(--sunken) center/cover;
  position:relative;overflow:hidden;transition:border-color var(--t1) var(--ease)}
.thumb:hover{border-color:var(--line)}
.thumb[aria-current="true"]{border-color:var(--ink)}
.thumb .t-art{position:absolute;left:29%;top:41%;width:28.1%}
.thumb .t-art img{width:100%;display:block}
.thumb > img.full{width:100%;height:100%;object-fit:cover}
.thumb.work{background:var(--stage) url('assets/pdp-background.jpg') center/cover;display:grid;place-items:center}
.thumb.work img{width:66%;height:auto}
@media(max-width:1023px){ .thumbs{display:none} }

.stage-tools{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.stage-tool{width:34px;height:34px;display:grid;place-items:center;color:var(--ink);
  transition:background var(--t1) var(--ease)}
.stage-tool:hover{background:rgba(255,255,255,.5)}
.stage-actions{position:absolute;right:14px;bottom:14px;display:flex;gap:6px}
.stage-act{display:flex;align-items:center;gap:7px;background:var(--page);border:1px solid var(--line);
  padding:8px 12px;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  transition:border-color var(--t1) var(--ease)}
.stage-act:hover{border-color:var(--ink)}

/* ── buy box ─────────────────────────────────────────── */
.buy{position:sticky;top:calc(var(--hdr-h) + 24px);min-width:0;padding-top:clamp(26px,3.1vw,54px)}
@media(max-width:1023px){ .buy{position:static;padding:18px var(--pad) 0} }
.artist-holder{font-family:'utile-display',arial,sans-serif;font-weight:400;font-size:clamp(28px,2.6vw,37px);
  line-height:1.08;letter-spacing:-.04em;color:var(--ink)}
.artwork-title{font-size:13px;letter-spacing:1.3px;text-transform:uppercase;margin-top:7px}
.edition{margin-top:9px;font-size:15px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.edition .dotsep{color:var(--ink)}
.edition a{font-style:italic;text-decoration:underline;text-underline-offset:3px}

.sec-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;line-height:1.5;color:var(--ink)}
.sizes-block{margin-top:18px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;margin-top:12px}
.size{position:relative;padding:13px 4px;text-align:center;font-size:15px;line-height:1.15;color:var(--ink-soft);
  transition:color var(--t1) var(--ease)}
.size:hover{color:var(--ink)}
.size + .size::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:1px;background:var(--line)}
.size[aria-current="true"]{background:var(--page);color:var(--ink);border:1px solid var(--ink);border-radius:4px;margin:-1px}
.size[aria-current="true"]::before,.size[aria-current="true"] + .size::before{display:none}

.framing{margin-top:18px}
.framing-drawer{margin-top:10px}
.framing-drawer > summary{list-style:none;display:flex;align-items:center;gap:10px;background:var(--page);
  border:1px solid var(--ink);border-radius:3px;height:36px;padding:0 10px 0 20px;font-size:15px;cursor:pointer}
.framing-drawer > summary::-webkit-details-marker{display:none}
.framing-drawer > summary .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.framing-drawer > summary .chev{margin-left:auto}
.framing-drawer > summary .chev{flex:none;display:grid;transition:transform var(--t1) var(--ease)}
.framing-drawer[open] > summary .chev{transform:rotate(180deg)}
.framing-list{border:1px solid var(--line);border-top:0;border-radius:0 0 3px 3px;margin-top:-1px}
.framing-opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line-2);
  transition:background var(--t1) var(--ease)}
.framing-opt:first-child{border-top:0}
.framing-opt:hover{background:var(--sunken)}
.framing-opt[aria-current="true"]{background:var(--sunken)}
.framing-opt .sw{flex:none;width:34px;height:34px;background:#fff center/cover;background-image:var(--thumb)}
.sw-none{box-shadow:inset 0 0 0 1px rgba(28,26,24,.2)}
.sw-slim{box-shadow:inset 0 0 0 3px #24211d}
.sw-basel{box-shadow:inset 0 0 0 4px #141210,inset 0 0 0 9px #7a5b3f}
.sw-artbox{box-shadow:inset 0 0 0 1px rgba(28,26,24,.2),4px 4px 0 -1px rgba(28,26,24,.16)}
.framing-opt .fo-n{font-size:14px;line-height:1.3;min-width:0}
.framing-opt .fo-n small{display:block;font-size:11px;color:var(--ink-soft);line-height:1.4}
.framing-opt .fo-p{margin-left:auto;white-space:nowrap;font-size:14px}

.price-container{margin-top:20px}
.price{font-size:32px;line-height:1.1;color:var(--ink)}

/* availability, built on the live demand-indicator band */
/* gallery card, the availability surface */
.gcard-lite{margin-top:14px;border:1px solid var(--line-2);border-radius:2px;background:var(--page);
  transition:border-color var(--t1) var(--ease)}
.gcard-lite:hover{border-color:var(--line)}
.gc-head{display:flex;align-items:center;gap:13px;padding:14px 16px;width:100%;text-align:left;cursor:pointer;
  background:transparent;transition:background var(--t1) var(--ease)}
.gcard-lite:hover .gc-head{background:#FAF7F3}
.gcard-lite[data-open="1"] .gc-head{background:#FAF7F3;border-bottom:1px solid var(--line-2)}
.gc-head .pin{flex:none;display:grid;place-items:center;color:#2D6A31}
.gc-head .pin svg{width:19px;height:19px;stroke-width:1.3}
.gcard-lite[data-in="0"] .gc-head .pin{color:var(--ink-soft)}
.gc-txt{min-width:0;flex:1}
.gc-name{font-size:14px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-name .g-short{display:none}
@media(max-width:1500px){
  .gc-name .g-full{display:none}
  .gc-name .g-short{display:inline}
  .gc-sub .grp:last-child{display:none}
}
.gc-sub{margin-top:3px;font-size:14px;line-height:1.45;color:var(--ink-soft);
  display:flex;align-items:center;gap:5px;flex-wrap:nowrap;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.gc-stock{color:#8F2E22;font-weight:700}
.gcard-lite[data-in="0"] .gc-stock{color:var(--ink-soft);font-weight:400}
.gc-sub .grp{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.gc-sub .s-short{display:none}
.gc-sub .odot{width:8px;height:8px;border-radius:50%;background:#2D6A31;flex:none}
.gc-sub .odot[data-open="0"]{background:var(--line)}
.gc-sub .sep{color:rgba(28,26,24,.32)}
.gc-toggle{flex:none;display:flex;align-items:center;gap:9px;pointer-events:none;
  font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);
  transition:color var(--t1) var(--ease)}
.gc-toggle:hover{color:var(--ink)}
.gc-toggle svg{transition:transform var(--t2) var(--ease)}
.gcard-lite[data-open="1"] .gc-toggle{color:var(--ink)}
.gcard-lite[data-open="1"] .gc-toggle svg{transform:rotate(180deg)}
.gc-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t2) var(--ease)}
.gcard-lite[data-open="1"] .gc-wrap{grid-template-rows:1fr}
.gc-body{overflow:hidden;min-height:0}
.gc-body-in{padding:24px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,44%);
  gap:22px;align-items:start;grid-template-areas:'info map'}
.gc-info{grid-area:info;min-width:0}
.gc-map{grid-area:map}
.gc-btns{display:none;gap:10px}
.gc-btn{display:flex;align-items:center;justify-content:center;gap:9px;height:52px;flex:1;
  text-decoration:none;
  border:1px solid var(--line);font-size:13px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  transition:border-color var(--t1) var(--ease),background var(--t1) var(--ease)}
.gc-btn:hover{border-color:var(--ink);background:#FAF7F3}
.gc-body-in p{font-size:15px;line-height:1.5;color:var(--ink-soft);margin-bottom:26px}
.gc-links p:last-child{margin-bottom:0}
.gc-body-in p a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.gc-map{aspect-ratio:1/1.05;background:#EAE6DE;position:relative;
  background-image:linear-gradient(rgba(28,26,24,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(28,26,24,.07) 1px,transparent 1px);background-size:20% 20%}
.gc-map .mpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-60%);color:#2D6A31}
.gc-map .mpin svg{width:30px;height:30px;stroke-width:1.25}


.actions{margin-top:10px;display:grid;gap:9px}
.trust{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.trust .sep{color:rgba(28,26,24,.3)}
.btn-primary{height:54px;background:var(--ink);color:var(--cta-text);display:flex;align-items:center;
  justify-content:center;gap:12px;font-size:14px;letter-spacing:1.6px;text-transform:uppercase;
  transition:background var(--t1) var(--ease)}
.btn-primary:hover{background:#000}
.btn-secondary{height:54px;background:var(--sunken);color:var(--ink);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;letter-spacing:1.6px;
  text-transform:uppercase;transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.btn-secondary:hover{background:#E9E2D7;border-color:var(--line-strong)}
.or-sep{display:flex;align-items:center;gap:14px;margin:3px 0;font-size:11.5px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--ink-soft)}
.or-sep::before,.or-sep::after{content:'';flex:1;height:1px;background:var(--line-2)}
.more-info{margin-top:12px;font-size:9px;line-height:1.5;letter-spacing:.4px;text-transform:uppercase;color:var(--ink)}
.more-info a{text-decoration:underline;text-underline-offset:2px}

.ftr{padding:30px var(--pad) 44px;border-top:1px solid var(--line-2);display:flex;gap:22px;flex-wrap:wrap;
  font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}

/* ── gallery drawer ──────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(28,26,24,.28);opacity:0;pointer-events:none;
  transition:opacity var(--t2) var(--ease);z-index:70}
body.drawer-open .scrim{opacity:1;pointer-events:auto}
@media(min-width:1180px){ body.drawer-open .scrim{opacity:0;pointer-events:none} }
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--drawer-w),calc(100vw - 40px));background:var(--page);
  z-index:80;display:flex;flex-direction:column;border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform var(--t2) var(--ease);visibility:hidden}
body.drawer-open .drawer{transform:none;visibility:visible}
.dr-top{padding:16px 20px 14px;border-bottom:1px solid var(--line-2);flex:none}
.dr-row1{display:flex;align-items:center;justify-content:space-between;gap:14px}
.dr-title{font-size:11px;font-weight:700;letter-spacing:1.68px;text-transform:uppercase}
.dr-cfg{margin-top:12px;padding:11px 12px;background:var(--band);border-radius:2px;display:grid;gap:4px}
.dr-cfg .a{font-size:14px;font-weight:700}
.dr-cfg .b{font-size:13px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:var(--ink)}
.dr-cfg .pr{margin-left:auto;font-weight:700}
.dr-list{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.gcard{padding:16px 20px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background var(--t1) var(--ease)}
.gcard:hover{background:var(--sunken)}
.gcard[aria-current="true"]{background:var(--sunken);box-shadow:inset 3px 0 0 var(--ink)}
.gc-1{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.gc-nm{font-size:15px;font-weight:700}
.gc-km{font-size:11px;letter-spacing:.6px;color:var(--ink-soft);white-space:nowrap}
.gc-st{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px}
.gc-ad{margin-top:7px;font-size:12px;line-height:1.55;color:var(--ink-soft)}
.gc-hr{margin-top:4px;font-size:12px;color:var(--ink-soft)}
.gc-act{display:flex;gap:16px;margin-top:11px;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
.gc-act a{border-bottom:1px solid var(--line);padding-bottom:2px;transition:border-color var(--t1) var(--ease)}
.gc-act a:hover{border-color:var(--ink)}
.dr-foot{flex:none;padding:14px 20px;border-top:1px solid var(--line-2);font-size:11px;line-height:1.6;color:var(--ink-soft)}

/* ── reserve modal ───────────────────────────────────── */
.rv{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
body.reserve-open .rv{display:flex}
body.reserve-open{overflow:hidden}
.rv-scrim{position:absolute;inset:0;background:rgba(28,26,24,.5)}
.rv-card{position:relative;width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;
  background:var(--page);padding:30px 32px 32px;animation:rise 320ms var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rv-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-soft)}
.rv-x{position:absolute;top:24px;right:26px;width:30px;height:30px;display:grid;place-items:center;
  color:var(--ink);transition:opacity var(--t1) var(--ease)}
.rv-x:hover{opacity:.6}
.rv-card h2{margin-top:14px;font-family:'utile-display',arial,sans-serif;font-weight:400;font-size:30px;
  line-height:1.14;letter-spacing:-.025em;padding-right:30px}
.rv-lead{margin-top:14px;font-size:15px;line-height:1.6;color:var(--ink-soft)}
.rv-lead i{font-style:italic;color:var(--ink)}
.rv-form{margin-top:22px;display:grid;gap:10px}
.rv-form input{width:100%;height:62px;padding:0 18px;border:0;border-radius:0;background:#EDEAE4;
  font:inherit;font-size:16px;color:var(--ink);outline:0;transition:box-shadow var(--t1) var(--ease)}
.rv-form input::placeholder{color:#8A8580}
.rv-form input:focus{box-shadow:inset 0 0 0 1px var(--ink)}
.rv-submit{height:62px;width:100%;background:#BDB8B0;color:#fff;font-size:14px;letter-spacing:1.6px;
  text-transform:uppercase;transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.rv-form[data-valid="1"] .rv-submit{background:var(--ink);color:var(--cta-text);cursor:pointer}
.rv-foot{margin-top:16px;font-size:13px;line-height:1.6;color:var(--ink-soft)}
.rv-done{display:none;text-align:center;padding:8px 0 2px}
.rv-card[data-done="1"] .rv-body{display:none}
.rv-card[data-done="1"] .rv-done{display:block}
.rv-check{width:46px;height:46px;border-radius:50%;background:#2D6A31;color:#fff;display:grid;
  place-items:center;margin:0 auto 16px}
.rv-done h3{font-family:'utile-display',arial,sans-serif;font-weight:400;font-size:26px;letter-spacing:-.02em}
.rv-done p{margin-top:10px;font-size:15px;line-height:1.6;color:var(--ink-soft)}
.rv-done a{display:inline-block;margin-top:16px;font-size:12px;font-weight:700;letter-spacing:1.6px;
  text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:3px}
@media(max-width:560px){
  .rv{padding:0;align-items:flex-end}
  .rv-card{width:100%;max-height:94vh;padding:24px 20px 26px}
  .rv-card h2{font-size:25px}
  .rv-x{top:19px;right:16px}
  .rv-form input{height:56px}
  .rv-submit{height:56px;font-size:11px;letter-spacing:.8px;padding:0 12px}
}

/* ── mobile ──────────────────────────────────────────── */
.menu-btn{display:none}
@media(max-width:1023px){
  :root{--promo-h:40px;--hdr-h:56px}
  .nav,.search{display:none}
  .menu-btn{display:grid;margin-left:-6px}
  .promo{font-size:11px;gap:12px;padding:0 40px 0 12px}
  .promo-cta{padding:6px 12px;font-size:10px;letter-spacing:1.2px}
  .hdr-r .ib[data-hide]{display:none}
  .stage-bar{display:flex;padding:10px var(--pad);font-size:10.5px;gap:7px;overflow:hidden}

  .stage-bar .g-full{display:none}
  .stage-bar .g-short{display:inline}
  .stage-bar .meta{text-transform:none;letter-spacing:.2px;font-size:11.5px}
  .stage{--stage-pad:12px}
  .artwrap{width:min(calc(100% - 24px),31vh)}
  .stage-tools{top:8px;right:8px}
  .stage-actions{right:8px;bottom:8px}
  .stage-act{padding:7px 9px;font-size:9px}
  .buy{padding:14px var(--pad) 0}
  .artist-holder{font-size:27px;text-align:center}
  .artwork-title{text-align:center}
  .edition{justify-content:center}
  .edition{margin-top:6px;font-size:14px}
  .size{padding:8px 3px;font-size:14px}
  .framing{margin-top:12px}
  .framing-drawer{margin-top:7px}
  .framing-drawer > summary{height:42px;padding:0 10px 0 14px}
  .sizes-block{margin-top:12px}
  .sizes{margin-top:7px}
  .price-container{margin-top:12px}
  .price{font-size:28px}
  .gcard-lite{margin-top:12px}
  .gc-head{padding:12px 13px;gap:10px}
  .gc-name{font-size:12px;letter-spacing:1px}
  .gc-name .g-full{display:none}
  .gc-name .g-short{display:inline}
  .gc-sub{font-size:13px;gap:6px}
  .gc-toggle .t-show,.gc-toggle .t-hide{display:none}
  .gc-body-in{padding:16px 14px 14px;gap:18px;grid-template-columns:1fr;
    grid-template-areas:'map' 'info'}
  .gc-map{aspect-ratio:2.6/1;background-size:44px 44px}
  .gc-info p{margin-bottom:18px}
  .gc-links{display:none}
  .gc-btns{display:flex}
  .gc-sub .s-full{display:none}
  .gc-sub .s-short{display:inline}
  .gc-sub{flex-wrap:nowrap;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gc-sub .grp:last-child{display:none}
  .gc-body-in{padding:14px 13px;gap:14px}
  .btn-primary,.btn-secondary{height:52px;font-size:13px;letter-spacing:1.3px}
  .or-sep{font-size:10.5px;letter-spacing:1.2px;gap:11px}
  .trust{font-size:11px;gap:10px}
  .more-info{font-size:8.5px}
  .actions{margin-top:10px}
}

<body>
<script>
/* ═══════════════════════════════════════════════════════════════════
   DATA MODEL — inventory belongs to the CONFIGURATION, not the artwork.

     Artwork
       └── Configuration  (size + frame)
             ├── price          = print price + framing price
             └── galleryInventory
                   ├── gallery, quantity, address, openingHours

   Sizes/prices: DE feed, abstract 18685. Framing prices: PIM option set
   per SKU, receiver DE. Galleries: live LUMAS gallery pages. Only the
   per-configuration unit counts are mock.

   RENDERING CONTRACT — the page is one pure function of (URL params +
   gallery cookie), run synchronously during parse, so price and
   availability are in the first paint. No post-load rewrite, no
   "checking availability" skeleton. Changing size, framing or gallery is
   a real navigation to a new URL.
   ═══════════════════════════════════════════════════════════════════ */

const ARTWORK = {
  artist:'Marta Contreras Simó', title:'Liu', series:'ASIA',
  editionSize:150, signature:'Signed', creationYear:2023, publicationYear:2024,
  technique:'Archival pigment print on Hahnemühle Photo Rag',
  image:'https://img.lumas.com/showimg_mcs13_full.jpg'
};

const SIZES = [
  { id:'s40',  sku:'MCS15', label:'40 x 40',   cm:40,  pricePrint:230 },
  { id:'s80',  sku:'MCS14', label:'80 x 80',   cm:80,  pricePrint:610 },
  { id:'s120', sku:'MCS13', label:'120 x 120', cm:120, pricePrint:790 }
];

const FRAMES = [
  { id:'none',   name:'No framing',                     full:'Print only, shipped rolled',      gloss:0, addCm:0,   price:{s40:0,   s80:0,   s120:0  } },
  { id:'slim',   name:'Acrylic glass, slimline mount',   full:'Matt acrylic glass',              gloss:0, addCm:1.5, price:{s40:149, s80:359, s120:709} },
  { id:'basel',  name:'Basel frame with shadow gap',     full:'15 mm profile, matt acrylic',     gloss:0, addCm:8,   price:{s40:249, s80:519, s120:879} },
  { id:'artbox', name:'Luma ArtBox, 50 mm',             full:'Gloss acrylic, 50 mm depth',      gloss:1, addCm:6,   price:{s40:229, s80:509, s120:909} }
];

const GALLERIES = [
  { id:'kudamm',      name:'Berlin, Kurfürstendamm',  city:'Berlin',    street:'Fasanenstraße 73',                zip:'10719 Berlin',     km:1.2, phone:'+49 30 88 62 76 01', hours:[['Mon to Fri','11:00','19:00'],['Sat','10:00','19:00']] },
  { id:'mitte',       name:'Berlin, Hackesche Höfe',  city:'Berlin',    street:'Rosenthaler Str. 40/41, Hof II',  zip:'10178 Berlin',     km:4.8, phone:'+49 30 28 04 03 73', hours:[['Mon to Sat','11:00','19:00']] },
  { id:'hamburg',     name:'Hamburg, Große Bleichen', city:'Hamburg',   street:'Große Bleichen 31, Kaufmannshaus',zip:'20354 Hamburg',    km:255, phone:'+49 40 38 90 48 60', hours:[['Mon to Sat','10:00','19:00']] },
  { id:'duesseldorf', name:'Düsseldorf, Grünstraße',  city:'Düsseldorf',street:'Grünstraße 8',                    zip:'40212 Düsseldorf', km:477, phone:'+49 211 82 82 622',  hours:[['Mon to Sat','10:00','18:00']] },
  { id:'koeln',       name:'Köln, Mittelstraße',      city:'Köln',      street:'Mittelstraße 15',                 zip:'50672 Köln',       km:478, phone:'+49 221 31 06 871',  hours:[['Mon to Sat','10:00','19:00']] },
  { id:'muenchen',    name:'München, Brienner Straße',city:'München',   street:'Brienner Straße 3',               zip:'80333 München',    km:504, phone:'+49 89 25 54 88 30', hours:[['Mon to Sat','10:00','19:00']] }
];

/* units of THIS size in THIS framing, per gallery */
const INVENTORY = {
  's40:none':{}, 's40:slim':{}, 's40:basel':{ kudamm:2, mitte:1 }, 's40:artbox':{ kudamm:4, hamburg:2, muenchen:1 },
  's80:none':{}, 's80:slim':{ kudamm:1, duesseldorf:2 }, 's80:basel':{ kudamm:3, hamburg:2, duesseldorf:1 }, 's80:artbox':{ duesseldorf:1, muenchen:2 },
  's120:none':{}, 's120:slim':{}, 's120:basel':{ hamburg:1, muenchen:1 }, 's120:artbox':{ kudamm:1 }
};

const byId = (arr,id,fb) => arr.find(x => x.id === id) || fb;

function configure(sizeId, frameId){
  const size = byId(SIZES, sizeId, SIZES[1]), frame = byId(FRAMES, frameId, FRAMES[2]);
  const key = size.id + ':' + frame.id, stock = INVENTORY[key] || {};
  return { key, size, frame,
    price: size.pricePrint + frame.price[size.id],
    framePrice: frame.price[size.id],
    outerCm: size.cm + frame.addCm,
    stock,
    holders: GALLERIES.filter(g => (stock[g.id] || 0) > 0).sort((a,b) => a.km - b.km),
    totalUnits: Object.values(stock).reduce((a,b) => a + b, 0) };
}

const Q = new URLSearchParams(location.search);
const COOKIE = 'lumas_gallery';
const readCookie = () => { const m = document.cookie.match(new RegExp('(?:^|; )'+COOKIE+'=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; };
const writeCookie = v => { document.cookie = v ? COOKIE+'='+encodeURIComponent(v)+';path=/;max-age=31536000;samesite=lax'
                                               : COOKIE+'=;path=/;max-age=0;samesite=lax'; };

const CFG = configure(Q.get('size'), Q.get('frame'));

let galleryId = Q.get('gallery');
if (galleryId === 'none'){ writeCookie(null); galleryId = null; }
else if (galleryId === 'auto'){ galleryId = (CFG.holders[0] || GALLERIES[0]).id; writeCookie(galleryId); }
else if (galleryId){ writeCookie(galleryId); }
else { galleryId = readCookie(); }

const GAL = galleryId ? byId(GALLERIES, galleryId, null) : null;

function availability(){
  if (!GAL) return { code:'none' };
  const q = CFG.stock[GAL.id] || 0;
  if (q >= 3) return { code:'A', qty:q, gallery:GAL };
  if (q >= 1) return { code:'B', qty:q, gallery:GAL };
  const alt = CFG.holders[0];
  if (alt)    return { code:'C', qty:0, gallery:GAL, alt };
  return { code:'D', qty:0, gallery:GAL };
}
const AV = availability();
const RESERVABLE = AV.code === 'A' || AV.code === 'B';


/* the reservation is held for 48 hours from now */
const HOLD_UNTIL = (() => {
  const d = new Date(Date.now() + 48 * 3600 * 1000);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mons = ['Jan','Feb','March','April','May','June','July','Aug','Sept','Oct','Nov','Dec'];
  const pad = n => String(n).padStart(2, '0');
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + mons[d.getMonth()]
    + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
})();

const money = n => '€ ' + n.toLocaleString('en-US');
const esc   = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = g => (g.name.split(', ')[1] || g.city);
const stockWord = q => q >= 3 ? 'In stock' : q === 2 ? 'Only 2 left' : 'Last one';

function href(over){
  const p = new URLSearchParams();
  p.set('size',  over.size  !== undefined ? over.size  : CFG.size.id);
  p.set('frame', over.frame !== undefined ? over.frame : CFG.frame.id);
  const g = over.gallery !== undefined ? over.gallery : galleryId;
  if (g) p.set('gallery', g);
  if (over.drawer) p.set('drawer','1');
  if (over.reserve) p.set('reserve','1');
  return '?' + p.toString();
}
const hoursText = g => g.hours.map(h => h[0] + ' ' + h[1] + ' to ' + h[2]).join(' · ');
function openState(g){
  const DAYS = { 'Mon to Fri':[1,5], 'Mon to Sat':[1,6], 'Sat':[6,6], 'Sun':[0,0] };
  const d = new Date(), day = d.getDay(), mins = d.getHours()*60 + d.getMinutes();
  const to = t => (+t.slice(0,2))*60 + (+t.slice(3));
  const today = g.hours.find(h => { const r = DAYS[h[0]]; return r && day >= r[0] && day <= r[1]; });
  if (!today) return { open:false, text:'Closed today', short:'Closed today' };
  if (mins < to(today[1])) return { open:false, text:'Opens today at ' + today[1], short:'Opens ' + today[1] };
  if (mins < to(today[2])) return { open:true,  text:'Open now until ' + today[2], short:'Open until ' + today[2] };
  return { open:false, text:'Opens tomorrow at ' + g.hours[0][1], short:'Opens tomorrow ' + g.hours[0][1] };
}
const mapsUrl = g => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('LUMAS ' + g.name + ', ' + g.street + ', ' + g.zip);
</script>

<script>
const ICO = {
  search:'<svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>',
  heart:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 20s-7.2-4.6-7.2-9.4A4 4 0 0 1 12 8a4 4 0 0 1 7.2 2.6C19.2 15.4 12 20 12 20z"/></svg>',
  user:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c1.3-3.5 3.9-5.2 7-5.2S17.7 16.5 19 20"/></svg>',
  bag:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 8h14l-1.1 12H6.1z"/><path d="M9 8V6.4A3 3 0 0 1 15 6.4V8"/></svg>',
  phone:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 4h3l1.6 4-2 1.4a12 12 0 0 0 6 6l1.4-2 4 1.6v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4 6.2 2 2 0 0 1 6 4z"/></svg>',
  chat:'<svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3.4-6.5"/><path d="M4.6 19.4 6 15.4"/><path d="M4.6 19.4 8.6 18"/></svg>',
  menu:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  pin:'<svg class="ico-s" viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  arrow:'<svg class="ico-s" viewBox="0 0 24 24"><path d="M4 12h15"/><path d="M13.5 6.5 20 12l-6.5 5.5"/></svg>',
  chev:'<svg class="ico-s" viewBox="0 0 24 24"><path d="M6 9.5 12 15.5 18 9.5"/></svg>',
  close:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  expand:'<svg class="ico" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/></svg>',
  room:'<svg class="ico-s" viewBox="0 0 24 24"><path d="M3 20V8l9-4 9 4v12"/><path d="M8.5 20v-6h7v6"/></svg>',
  cube:'<svg class="ico-s" viewBox="0 0 24 24"><path d="M12 3 4 7.2v9.6L12 21l8-4.2V7.2z"/><path d="M4 7.2 12 11.5l8-4.3M12 11.5V21"/></svg>',
  nav:'<svg class="ico-s" viewBox="0 0 24 24"><path d="M20.5 3.5 3.5 10.8l7.2 2.5 2.5 7.2z"/></svg>',
  cal:'<svg class="ico" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="1"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>',
  refresh:'<svg class="ico-s" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5"/><path d="M19.8 4.6v4.2h-4.2"/></svg>'
};

/* ── promo bar + header, mirroring the live chrome ─────────────── */
function renderPromo(){
  return '<span>10% off your first order, until 23.08.2026</span>'
    + '<a class="promo-cta" href="#">Claim it</a>'
    + '<button class="promo-x" id="promoX" aria-label="Close">' + ICO.close + '</button>';
}
function renderHeader(){
  return '<button class="ib menu-btn" aria-label="Menu">' + ICO.menu + '</button>'
    + '<a class="logo" href="' + href({}) + '" aria-label="LUMAS"><img src="assets/lumas-logo.svg" alt="LUMAS" width="118" height="22"></a>'
    + '<nav class="nav"><a href="#">Artworks</a><a href="#">Top 20</a><a href="#">Artfinder</a>'
      + '<a href="#">Inspiration</a><a href="#">Galleries</a><a href="#">About us</a></nav>'
    + '<label class="search">' + ICO.search + '<input type="search" placeholder="Search" aria-label="Search"></label>'
    + '<div class="hdr-r">'
      + '<button class="ib" data-hide aria-label="Contact">' + ICO.chat + '</button>'
      + '<button class="ib" data-hide aria-label="Call">' + ICO.phone + '</button>'
      + '<button class="ib" data-hide aria-label="Wishlist">' + ICO.heart + '</button>'
      + '<button class="ib" data-hide aria-label="Account">' + ICO.user + '</button>'
      + '<button class="ib" aria-label="Bag">' + ICO.bag + '</button>'
    + '</div>';
}

/* ── stage ─────────────────────────────────────────────────────── */
function renderStageBar(){
  if (!GAL) return '';
  const q = CFG.stock[GAL.id] || 0, os = openState(GAL);
  const label = q > 0 ? 'Only ' + q + ' in gallery' : 'Not in this configuration';
  const km = GAL.km < 10 ? GAL.km.toFixed(1) : Math.round(GAL.km);
  const dot = '<i class="sep">·</i>';
  return '<div class="stage-bar" data-in="' + (q > 0 ? 1 : 0) + '">'
    + '<i class="sdot"></i>'
    + '<span class="lbl">' + label + '</span>' + dot
    + '<span class="meta"><span class="g-full">LUMAS ' + esc(GAL.name) + '</span>'
      + '<span class="g-short">' + esc(short(GAL)) + '</span></span>' + dot
    + '<span class="meta">' + km + ' km</span>'
    + '<i class="sep d-only">·</i><span class="meta d-only">' + os.short + '</span>'
    + '<a class="dir d-only" href="' + mapsUrl(GAL) + '" target="_blank" rel="noopener">Get directions</a>'
  + '</div>';
}

function renderStage(){
  const framed = CFG.frame.id !== 'none';
  const art = framed ? 'assets/liu-framed.jpg' : ARTWORK.image;
  const alt = esc(ARTWORK.title + ', ' + ARTWORK.artist);
  const hang = '<span class="hang"><img src="' + art + '" alt="' + alt + '"></span>';
  return renderStageBar() + '<div class="stage" data-view="work" id="stage">'
    + '<div class="stage-tools">'
      + '<button class="stage-tool" aria-label="Enlarge">' + ICO.expand + '</button>'
      + '<button class="stage-tool" aria-label="Add to wishlist">' + ICO.heart + '</button></div>'
    + '<div class="view view-work"><div class="artwrap"><div class="frame" data-frame="'
      + (framed ? 'framed' : 'none') + '"><div class="inner">'
      + '<img src="' + art + '" alt="' + alt + '" width="1600" height="1600" fetchpriority="high"></div></div></div></div>'
    + '<div class="view view-kitchen"><div class="roombox">'
      + '<img class="bg" src="assets/room-kitchen.jpg" alt="A kitchen wall" loading="lazy">' + hang + '</div></div>'
    + '<div class="view view-living"><div class="roombox">'
      + '<img class="bg" src="assets/room-livingroom.jpg" alt="A living room wall" loading="lazy">' + hang + '</div></div>'
    + '<div class="view view-ar"><div class="flat"><img src="assets/pdp-ar.jpg" alt="Preview the work on your own wall" loading="lazy"></div></div>'
    + '<div class="view view-cert"><div class="flat"><img src="assets/pdp-cert.jpg" alt="Certificate of authenticity" loading="lazy"></div></div>'
    + '<div class="view view-corner"><div class="flat"><img src="assets/frame-corner.jpg" alt="Framing corner detail" loading="lazy"></div></div>'
    + '<div class="view view-back"><div class="flat"><img src="assets/frame-back.jpg" alt="Back of the framed work" loading="lazy"></div></div>'
    + '<div class="stage-actions">'
      + '<button class="stage-act">' + ICO.room + 'View in your room</button>'
      + '<button class="stage-act">' + ICO.cube + '3D view</button></div>'
  + '</div>' + renderThumbs();
}

function renderThumbs(){
  const framed = CFG.frame.id !== 'none';
  const art = framed ? 'assets/liu-framed.jpg' : ARTWORK.image;
  const t = [
    ['work',   '<img src="' + art + '" alt="">', 'The work'],
    ['kitchen','<img class="full" src="assets/room-kitchen.jpg" alt=""><span class="t-art"><img src="' + art + '" alt=""></span>', 'In a kitchen'],
    ['living', '<img class="full" src="assets/room-livingroom.jpg" alt=""><span class="t-art"><img src="' + art + '" alt=""></span>', 'In a living room'],
    ['ar',     '<img class="full" src="assets/pdp-ar.jpg" alt="">',       'On your own wall'],
    ['cert',   '<img class="full" src="assets/pdp-cert.jpg" alt="">',     'Certificate of authenticity'],
    ['corner', '<img class="full" src="assets/frame-corner.jpg" alt="">', 'Framing detail'],
    ['back',   '<img class="full" src="assets/frame-back.jpg" alt="">',   'Back view']
  ];
  return '<div class="thumbs" id="thumbs">' + t.map((r, i) =>
    '<button class="thumb' + (r[0] === 'work' ? ' work' : '') + '" data-view="' + r[0] + '" '
      + 'aria-current="' + (i === 0) + '" aria-label="' + r[2] + '" title="' + r[2] + '">' + r[1] + '</button>'
  ).join('') + '</div>';
}

/* ── buy box ───────────────────────────────────────────────────── */
function renderSizes(){
  return SIZES.map(z => {
    const on = z.id === CFG.size.id;
    return '<a class="size" href="' + href({size:z.id}) + '" aria-current="' + on + '">' + z.label + '</a>';
  }).join('');
}
function renderFraming(){
  const list = FRAMES.map(f => {
    const on = f.id === CFG.frame.id, add = f.price[CFG.size.id];
    return '<a class="framing-opt" href="' + href({frame:f.id}) + '" aria-current="' + on + '">'
      + '<span class="sw sw-' + f.id + '" style="--thumb:url(' + ARTWORK.image + ')"></span>'
      + '<span class="fo-n">' + esc(f.name) + '<small>' + esc(f.full) + '</small></span>'
      + '<span class="fo-p">' + (add ? '+ ' + money(add) : 'included') + '</span></a>';
  }).join('');
  return '<details class="framing-drawer">'
    + '<summary><span class="fname">' + esc(CFG.frame.name) + '</span>'
      + '<i class="chev">' + ICO.chev + '</i></summary>'
    + '<div class="framing-list">' + list + '</div></details>';
}

function renderAvail(){
  if (!GAL){
    return '<div class="gcard-lite" data-in="0" id="availRow">'
      + '<div class="gc-head"><span class="pin">' + ICO.pin + '</span><div class="gc-txt">'
        + '<div class="gc-name">Find your gallery</div>'
        + '<div class="gc-sub">See where this size and framing is hanging today</div>'
      + '</div><a class="gc-toggle" href="' + href({gallery:'auto'}) + '">Check' + ICO.arrow + '</a></div></div>';
  }
  const g = GAL, q = CFG.stock[g.id] || 0, os = openState(g);
  const km = g.km < 10 ? g.km.toFixed(1) : Math.round(g.km);
  const stockFull  = q > 0 ? 'Only ' + q + ' in ' + esc(g.city) : 'Not in this configuration';
  const stockShort = q > 0 ? 'Only ' + q + ' on display'          : 'Not in this configuration';
  const stock = '<span class="s-full">' + stockFull + '</span><span class="s-short">' + stockShort + '</span>';
  return '<div class="gcard-lite" data-in="' + (q > 0 ? 1 : 0) + '" data-open="0" id="availRow">'
    + '<button class="gc-head" id="gcToggle" aria-expanded="false"><span class="pin">' + ICO.pin + '</span><div class="gc-txt">'
      + '<div class="gc-name"><span class="g-full">LUMAS ' + esc(g.name) + '</span>'
        + '<span class="g-short">LUMAS ' + esc(short(g)) + '</span></div>'
      + '<div class="gc-sub"><span class="gc-stock">' + stock + '</span>'
        + '<span class="grp"><i class="sep">·</i><i class="odot" data-open="' + (os.open ? 1 : 0) + '"></i>'
          + os.short + '</span>'
        + '<span class="grp"><i class="sep">·</i>~' + km + ' km</span></div>'
    + '</div>'
    + '<span class="gc-toggle">'
      + '<span class="t-show">Details<span class="t-map"> &amp; map</span></span>'
        + '<span class="t-hide" hidden>Hide</span>' + ICO.chev + '</span></button>'
    + '<div class="gc-wrap"><div class="gc-body"><div class="gc-body-in">'
      + '<div class="gc-map"><span class="mpin">' + ICO.pin + '</span></div>'
      + '<div class="gc-info">'
        + '<p>' + esc(g.street) + ' · ' + esc(g.zip) + '</p>'
        + '<p>' + g.hours.map(h => h[0].replace(' to ', ' – ') + ' ' + h[1] + '–' + h[2]).join('<br>') + '</p>'
        + '<div class="gc-links">'
          + '<p>~' + km + ' km · <a href="' + mapsUrl(g) + '" target="_blank" rel="noopener">Get directions</a></p>'
          + '<p><a href="tel:' + g.phone.replace(/\s/g,'') + '">Call the gallery</a></p>'
        + '</div>'
        + '<div class="gc-btns">'
          + '<a class="gc-btn" href="' + mapsUrl(g) + '" target="_blank" rel="noopener">' + ICO.nav + 'Directions</a>'
          + '<a class="gc-btn" href="tel:' + g.phone.replace(/\s/g,'') + '">' + ICO.phone + 'Call</a>'
        + '</div>'
      + '</div>'
    + '</div></div></div></div>';
}

function renderBuy(){
  return '<div class="buy">'
    + '<h1 class="artist-holder">' + esc(ARTWORK.artist) + '</h1>'
    + '<div class="artwork-title">' + esc(ARTWORK.title) + '</div>'
    + '<div class="edition"><span>Limited Edition ' + ARTWORK.editionSize + '</span>'
      + '<span class="dotsep">•</span><span>' + esc(ARTWORK.signature) + '</span>'
      + '<a href="#">About this work</a></div>'
    + '<div class="sizes-block"><div class="sec-label">Choose size (cm)</div>'
      + '<div class="sizes">' + renderSizes() + '</div></div>'
    + '<div class="framing"><div class="sec-label">Choose framing</div>' + renderFraming() + '</div>'
    + '<div class="price-container"><div class="price">' + money(CFG.price) + '</div>'
      + '</div>'
    + renderAvail()
    + '<div class="actions">'
      + (RESERVABLE
          ? '<button class="btn-secondary" data-reserve>' + ICO.cal + 'Reserve for gallery visit</button>'
            + '<div class="trust"><span>Held 48h</span><i class="sep">·</i><span>No obligation to buy</span>'
            + '<i class="sep">·</i><span>Consultant available</span></div>'
            + '<div class="or-sep">or buy online now</div>'
          : '')
      + '<a class="btn-primary" href="#" id="ctaBtn">Add to cart</a>'
    + '</div>'
    + '<div class="more-info">Ships in 5 days / incl. VAT / plus <a href="#">shipping</a> € 6,90'
      + '<br>' + ARTWORK.creationYear + ' / ' + ARTWORK.publicationYear + ' / ' + CFG.size.sku + '</div>'
  + '</div>';
}
</script>

<script>
/* ── drawer ────────────────────────────────────────────────────── */
function renderDrawer(){
  const ordered = GALLERIES.slice().sort((a,b) =>
    ((CFG.stock[b.id] || 0) > 0) - ((CFG.stock[a.id] || 0) > 0) || a.km - b.km);
  return '<div class="dr-top"><div class="dr-row1"><span class="dr-title">Gallery availability</span>'
      + '<a class="ib" href="' + href({}) + '" aria-label="Close">' + ICO.close + '</a></div>'
      + '<div class="dr-cfg"><div class="a">' + esc(ARTWORK.title) + ', ' + esc(ARTWORK.artist) + '</div>'
      + '<div class="b"><span>' + CFG.size.label + ' cm</span><span class="dotsep">•</span>'
      + '<span>' + esc(CFG.frame.name) + '</span><span class="pr">' + money(CFG.price) + '</span></div></div></div>'
    + '<div class="dr-list">' + ordered.map(g => {
        const q = CFG.stock[g.id] || 0, os = openState(g), on = GAL && g.id === GAL.id;
        return '<div class="gcard" data-go="' + href({gallery:g.id, drawer:1}) + '" aria-current="' + !!on + '">'
          + '<div class="gc-1"><span class="gc-nm">' + esc(g.name) + '</span>'
            + '<span class="gc-km">' + (g.km < 10 ? g.km.toFixed(1) : Math.round(g.km)) + ' km</span></div>'
          + '<div class="gc-st">' + (q > 0
              ? '<i class="dot"></i><span class="b">' + stockWord(q) + '</span>'
              : '<i class="dot hollow"></i><span style="color:var(--ink-soft)">Not in this configuration</span>') + '</div>'
          + '<div class="gc-ad">' + esc(g.street) + '<br>' + esc(g.zip) + '</div>'
          + '<div class="gc-hr">' + hoursText(g) + ' · ' + os.text + '</div>'
          + '<div class="gc-act"><a href="' + href({gallery:g.id, drawer:1}) + '">'
            + (q > 0 ? 'Reserve here' : on ? 'Selected' : 'Select this gallery') + '</a>'
            + '<a href="' + mapsUrl(g) + '" target="_blank" rel="noopener">Directions</a>'
            + '<a href="tel:' + g.phone.replace(/\s/g,'') + '">Call</a></div></div>';
      }).join('') + '</div>'
    + '<div class="dr-foot">Stock is shown for the exact configuration above. Change the size or the framing and this list changes with it.</div>';
}

function renderReserve(){
  const g = GAL || CFG.holders[0] || GALLERIES[0];
  return '<a class="rv-scrim" href="#" aria-label="Close"></a>'
    + '<div class="rv-card" role="dialog" aria-modal="true" aria-labelledby="rvTitle" id="rvCard">'
      + '<div class="rv-body">'
        + '<span class="rv-eyebrow">Reserve for gallery visit</span>'
        + '<button class="rv-x" aria-label="Close">' + ICO.close + '</button>'
        + '<h2 id="rvTitle">See it in person, no strings attached.</h2>'
        + '<p class="rv-lead">We hold <i>' + esc(ARTWORK.title) + '</i> (' + CFG.size.label
          + ' cm) for 48 hours at LUMAS ' + esc(g.name) + '. No payment, no obligation, it simply '
          + 'will not be sold before your visit.</p>'
        + '<form class="rv-form" id="rvForm" data-valid="0" novalidate>'
          + '<input name="name" type="text" placeholder="Full name" required autocomplete="name">'
          + '<input name="phone" type="tel" placeholder="Phone" autocomplete="tel">'
          + '<input name="email" type="email" placeholder="Email" required autocomplete="email">'
          + '<button class="rv-submit" type="submit">Reserve, held until ' + HOLD_UNTIL + '</button>'
        + '</form>'
        + '<p class="rv-foot">A gallerist will confirm by phone or email. The reservation lapses '
          + 'automatically after 48 hours.</p>'
      + '</div>'
      + '<div class="rv-done">'
        + '<span class="rv-check"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg></span>'
        + '<h3>Reserved until ' + HOLD_UNTIL + '</h3>'
        + '<p>' + esc(ARTWORK.title) + ', ' + CFG.size.label + ' cm, ' + esc(CFG.frame.name)
          + ', is held for you at LUMAS ' + esc(g.name) + '. A gallerist will confirm shortly.</p>'
        + '<a href="' + mapsUrl(g) + '" target="_blank" rel="noopener">Get directions</a>'
      + '</div>'
    + '</div>';
}
</script>

<div class="promo" id="promo"></div>
<script>document.getElementById('promo').innerHTML = renderPromo();</script>

<header class="hdr"><div class="hdr-in" id="hdrIn"></div><div class="hdr-rule"></div></header>
<script>document.getElementById('hdrIn').innerHTML = renderHeader();</script>

<div class="rv" id="rv"></div>

<div class="shell">
  <main class="hero" id="hero"></main>
  <script>document.getElementById('hero').innerHTML = '<div class="stage-col">' + renderStage() + '</div>' + renderBuy();</script>
  <footer class="ftr"><span>LUMAS</span><a href="#">Galleries</a><a href="#">Delivery and returns</a><a href="#">Framing</a><a href="#">Contact</a></footer>
</div>

<a class="scrim" href="#" id="scrim" aria-label="Close availability panel"></a>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-label="Gallery availability"></aside>

<script>
document.getElementById('rv').innerHTML     = renderReserve();
document.getElementById('drawer').innerHTML = renderDrawer();
document.getElementById('scrim').setAttribute('href', href({}));

if (Q.get('drawer') === '1') document.body.classList.add('drawer-open');
if (Q.get('reserve') === '1') document.body.classList.add('reserve-open');

/* the reserve modal owns a URL, so it is linkable and survives a reload */
function setReserve(open, push){
  document.body.classList.toggle('reserve-open', open);
  if (push) history.pushState({reserve:open?1:0}, '', open ? href({reserve:1}) : href({}));
  if (open){ const f = document.querySelector('#rvForm input'); if (f) f.focus({preventScroll:true}); }
}
function closeReserve(){
  if (!document.body.classList.contains('reserve-open')) return false;
  setReserve(false, true);
  return true;
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-reserve]')){ e.preventDefault(); setReserve(true, true); return; }
  if (e.target.closest('.rv-scrim, .rv-x')){ e.preventDefault(); closeReserve(); }
});

/* details & map is view state, so it stays out of the URL */
const gcToggle = document.getElementById('gcToggle');
if (gcToggle) gcToggle.addEventListener('click', () => {
  const card = document.getElementById('availRow');
  const open = card.dataset.open !== '1';
  card.dataset.open = open ? '1' : '0';
  gcToggle.setAttribute('aria-expanded', open);
  gcToggle.querySelector('.t-show').hidden = open;
  gcToggle.querySelector('.t-hide').hidden = !open;
});

/* the submit only lights up once the required fields hold something usable */
const rvForm = document.getElementById('rvForm');
if (rvForm){
  const valid = () => rvForm.name.value.trim().length > 1 && /.+@.+\..+/.test(rvForm.email.value);
  rvForm.addEventListener('input', () => { rvForm.dataset.valid = valid() ? '1' : '0'; });
  rvForm.addEventListener('submit', e => {
    e.preventDefault();
    if (!valid()) return;
    document.getElementById('rvCard').dataset.done = '1';
  });
}
addEventListener('popstate', () => {
  setReserve(new URLSearchParams(location.search).get('reserve') === '1', false);
});

/* gallery=auto is resolved once, then the URL is canonicalised, the way a
   server would redirect to the resolved configuration URL */
if (Q.get('gallery') === 'auto' && galleryId){
  history.replaceState(null, '', href({ gallery:galleryId, drawer: Q.get('drawer') === '1' }));
}

/* availability changed because the configuration changed */
try {
  const prev = sessionStorage.getItem('lumas_cfg');
  if (prev && prev !== CFG.key) document.body.dataset.cfgchanged = '1';
  sessionStorage.setItem('lumas_cfg', CFG.key);
} catch(e){}


/* thumbnail rail switches the stage view; this is gallery state, not product state */
const thumbs = document.getElementById('thumbs'), stage = document.getElementById('stage');
if (thumbs && stage){
  thumbs.addEventListener('click', e => {
    const b = e.target.closest('.thumb');
    if (!b) return;
    stage.dataset.view = b.dataset.view;
    thumbs.querySelectorAll('.thumb').forEach(t => t.setAttribute('aria-current', t === b));
  });
}

/* whole gallery card is clickable without nesting links */
document.getElementById('drawer').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const card = e.target.closest('.gcard');
  if (card) location.href = card.dataset.go;
});

document.getElementById('promoX').addEventListener('click', () => { document.body.dataset.promo = '0'; });

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (closeReserve()) return;
  if (document.body.classList.contains('drawer-open')) location.href = href({});
});
</script>
</body>
</html>
