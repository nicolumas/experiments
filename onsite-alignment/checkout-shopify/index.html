<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LUMAS Checkout — Shopify Style (V2)</title>
<script src="../assets/gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#1C1A18;
    --charcoal-700:#3A3835;
    --text-secondary:#5A5752;
    --text-tertiary:#908C87;
    --text-disabled:#C7C3BE;
    --ivory-100:#F4EDE2;
    --ivory-200:#F7F1E9;
    --ivory-300:#FAF6F1;
    --bone-100:#E2D8CC;
    --bone-200:#EAE2D8;
    --bone-300:#F0EBE3;
    --success:#3A6B4A;
    --success-bg:#E8F2EB;
    --error:#B5352A;
    --error-bg:#FDECEA;
    --radius:4px;
    --tpGreen:#00B67A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Archivo',system-ui,Arial,sans-serif;
    font-variation-settings:"wdth" 100;
    color:var(--charcoal);
    background:var(--ivory-100);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;}
  img{display:block;max-width:100%;}
  p{margin:0;}
  button{font:inherit;}

  /* ---------- Prototype switcher (not part of the design) ---------- */
  .switcher{
    position:sticky;top:0;z-index:100;
    display:flex;gap:6px;align-items:center;
    padding:10px 16px;background:var(--charcoal);color:#fff;
    font-size:13px;flex-wrap:wrap;
  }
  .switcher .brand{font-weight:700;letter-spacing:.02em;margin-right:14px;opacity:.9;}
  .switcher button{
    font-weight:600;color:#cfcfcf;background:#2c2a27;border:1px solid #46433f;
    padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .switcher button:hover{color:#fff;border-color:#6a655e;}
  .switcher button.active{background:#fff;color:var(--charcoal);border-color:#fff;}
  .switcher button.demo{background:var(--success);border-color:var(--success);color:#fff;}
  .switcher button.demo.active{background:var(--ivory-100);color:var(--success);border-color:var(--ivory-100);}
  .switcher .note{margin-left:auto;opacity:.55;font-size:12px;}

  .stage{padding:0;}
  .stage.mobileStage{padding:28px 16px;display:flex;justify-content:center;background:var(--bone-300);}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--charcoal);color:var(--ivory-100);padding:12px 20px;border-radius:8px;
    font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:200;
    box-shadow:0 8px 32px rgba(0,0,0,.2);max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Announcement bar ---------- */
  .promo{
    background:var(--charcoal);color:#fff;display:flex;align-items:center;justify-content:center;gap:16px;
    padding:11px 20px;position:relative;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    text-align:center;
  }
  .promo .promoText{max-width:640px;}
  .promo .promoBtn{
    background:var(--ivory-100);color:var(--charcoal);border-radius:0;padding:8px 18px;font-size:12px;font-weight:700;
    letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;cursor:pointer;border:none;
  }
  .promo .promoClose{position:absolute;right:16px;top:50%;transform:translateY(-50%);opacity:.9;cursor:pointer;font-size:15px;background:none;border:none;color:#fff;}

  /* ---------- Header / logo ---------- */
  .siteHead{background:#fff;border-bottom:1px solid var(--bone-200);}
  .siteHead .inner{display:flex;align-items:center;justify-content:center;min-height:119px;position:relative;padding:0 24px;}
  .siteHead .logo{width:176px;height:33px;}
  .siteHead .logo svg{width:100%;height:100%;fill:var(--charcoal);}

  /* ---------- Rating badge (was Trustpilot green, now neutral charcoal/ivory) ---------- */
  .tpCard{
    border:1px solid var(--bone-100);background:#fff;
    border-radius:0;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:7px;width:100%;
  }
  .tpRow{display:flex;align-items:center;gap:10px;}
  .tpRow .lbl{font-weight:600;font-size:16px;letter-spacing:-.16px;color:var(--charcoal);}
  .tpStars{display:flex;gap:2px;}
  .tpStars .sq{width:17px;height:17px;background:var(--tpGreen);display:flex;align-items:center;justify-content:center;border-radius:1px;}
  .tpStars .sq svg{width:13px;height:13px;fill:#fff;}
  .tpRow2 .txt{font-weight:500;font-size:14px;letter-spacing:-.14px;color:var(--charcoal);text-decoration:underline;text-underline-offset:2px;}
  .tpWord{height:18px;display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;letter-spacing:-.02em;color:#000;}
  .tpWord .pin{width:16px;height:16px;background:var(--tpGreen);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .tpWord .pin svg{width:12px;height:12px;fill:#fff;}

  /* ---------- Review-quote card (desktop v1) ---------- */
  .tpReviewWrap{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%;}
  .tpLogoBig{height:31px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:26px;letter-spacing:-.02em;color:#000;}
  .tpLogoBig .pin{width:28px;height:28px;background:var(--tpGreen);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .tpLogoBig .pin svg{width:20px;height:20px;fill:#fff;}
  .reviewCard{background:var(--ivory-200);border-radius:0;padding:16px;display:flex;flex-direction:column;gap:10px;width:100%;}
  .reviewCard .top{display:flex;align-items:center;justify-content:space-between;}
  .reviewCard .stars{display:flex;gap:2px;}
  .reviewCard .stars .sq{width:17px;height:17px;background:var(--tpGreen);border-radius:1px;display:flex;align-items:center;justify-content:center;}
  .reviewCard .stars .sq svg{width:13px;height:13px;fill:#fff;}
  .reviewCard .tpFoot{display:flex;align-items:center;gap:6px;padding-top:2px;}
  .reviewCard .date{font-size:14px;color:var(--text-tertiary);letter-spacing:-.14px;}
  .reviewCard .quote{font-size:14px;color:var(--text-secondary);letter-spacing:-.14px;line-height:1.35;}
  .reviewCard .author{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--text-tertiary);letter-spacing:-.14px;}
  .reviewCard .author svg{width:12px;height:12px;}

  /* ---------- Express checkout ---------- */
  .expressLabel{text-align:center;font-size:13px;color:var(--text-tertiary);}
  .expressBtns{display:flex;gap:12px;justify-content:center;}
  .expressBtns .xbtn{height:48px;flex:1;max-width:210px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;border:none;padding:0 10px;}
  .expressBtns .paypal{background:#ffc439;}
  .expressBtns .paypal img{height:28px;}
  .expressBtns .applepay{background:#000;}
  .expressBtns .applepay img{height:32px;}
  .expressBtns .amazonpay{background:#232f3e;}
  .amazonLogo{display:flex;flex-direction:column;align-items:flex-start;gap:1px;}
  .amazonLogo .txt{display:flex;align-items:baseline;gap:3px;color:#fff;line-height:1;}
  .amazonLogo .txt span:first-child{font-size:16px;font-weight:400;}
  .amazonLogo .txt span:last-child{font-size:16px;font-weight:700;}
  .amazonLogo .smile{width:52px;height:10px;margin-left:1px;}

  .oder{display:flex;align-items:center;gap:14px;color:var(--text-tertiary);font-size:12px;text-transform:uppercase;letter-spacing:.08em;}
  .oder::before,.oder::after{content:'';flex:1;height:1px;background:var(--bone-200);}

  /* ---------- Form ---------- */
  .section{display:flex;flex-direction:column;gap:12px;}
  .secHead{display:flex;align-items:center;justify-content:space-between;}
  .secHead h2{margin:0;font-family:'UtileDisplay',Georgia,serif;font-size:22px;font-weight:400;letter-spacing:0;}
  .secHead .link{font-size:14px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;padding:0;}
  .subtle{font-size:12px;color:var(--text-tertiary);}

  .field{position:relative;}
  .field input{
    width:100%;height:48px;border:1px solid var(--bone-100);border-radius:var(--radius);
    padding:0 14px;font-family:'Archivo',sans-serif;font-size:14px;color:var(--charcoal);background:#fff;
  }
  .field input:focus{outline:none;border:2px solid var(--charcoal);padding:0 13px;}
  .field.hasIcon input{padding-right:40px;}
  .field input::placeholder{color:var(--text-tertiary);}
  .field .fic{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-tertiary);}
  .field .floatLbl{position:absolute;left:12px;top:6px;font-size:11px;color:var(--text-tertiary);}
  .field.floating input{padding-top:16px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .select{position:relative;}
  .select select{
    width:100%;height:56px;border:1px solid var(--bone-100);border-radius:var(--radius);
    padding:18px 14px 6px;font-family:'Archivo',sans-serif;font-size:14px;color:var(--charcoal);background:#fff;
    appearance:none;-webkit-appearance:none;cursor:pointer;
  }
  .select select:focus{outline:none;border:2px solid var(--charcoal);}
  .select .floatLbl{position:absolute;left:14px;top:8px;font-size:11px;color:var(--text-tertiary);pointer-events:none;}
  .select .caret{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-secondary);pointer-events:none;}

  .miniBtn{height:44px;padding:0 24px;border:none;border-radius:0;background:var(--charcoal);color:#fff;font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;align-self:flex-start;}
  .miniBtn:hover{background:var(--charcoal-700);}
  .checkline{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--charcoal);cursor:pointer;}
  .checkline .box{width:18px;height:18px;border:1px solid var(--bone-100);border-radius:4px;flex:none;margin-top:1px;background:#fff;}
  .checkline .box.on{background:var(--charcoal);border-color:var(--charcoal);display:flex;align-items:center;justify-content:center;}
  .checkline .box.on svg{width:12px;height:12px;fill:#fff;}

  .infoBox{background:var(--bone-300);border-radius:0;padding:16px;font-size:14px;color:var(--text-tertiary);}

  /* Payment list */
  .payList{border:1px solid var(--bone-200);border-radius:0;overflow:hidden;}
  button.payRow, button.addrCard{border:none;margin:0;background:transparent;cursor:pointer;font:inherit;color:inherit;text-align:left;appearance:none;-webkit-appearance:none;}
  .payRow{display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;border-bottom:1px solid var(--bone-200);cursor:pointer;}
  .payRow:last-child{border-bottom:none;}
  .payRow .radio{width:18px;height:18px;border:1.5px solid var(--text-disabled);border-radius:50%;flex:none;position:relative;}
  .payRow.on .radio{border-color:var(--charcoal);}
  .payRow.on .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--charcoal);}
  .payRow .name{flex:1;font-weight:400;font-size:15px;letter-spacing:-.3px;}
  .payChips{display:flex;align-items:center;gap:5px;}
  .chip{height:20px;min-width:32px;border:1px solid var(--bone-200);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .chip img{height:14px;}
  .chip.visa{background:#1a1f71;color:#fff;font-weight:800;font-size:9px;font-style:italic;letter-spacing:.02em;}
  .chip.mc{gap:0;}
  .chip.mc .c{width:11px;height:11px;border-radius:50%;}
  .chip.mc .c.r{background:#eb001b;}
  .chip.mc .c.o{background:#f79e1b;margin-left:-5px;mix-blend-mode:multiply;}
  .chip.more{border:none;font-size:12px;color:var(--text-secondary);font-weight:600;min-width:auto;}
  .chip.applepay{background:#000;}
  .chip.applepay img{height:12px;}
  .chip.paypal{border:none;background:transparent;}
  .chip.paypal img{height:16px;}

  .payRow.selectedGroup{background:var(--ivory-300);box-shadow:inset 0 0 0 1px var(--charcoal);border-bottom:none;cursor:default;position:relative;z-index:1;}
  .payBody{background:var(--ivory-300);box-shadow:inset 1px 0 0 var(--charcoal),inset -1px 0 0 var(--charcoal),inset 0 -1px 0 var(--charcoal);padding:0 14px 16px;display:flex;flex-direction:column;gap:10px;}
  .payBody .field input{background:#fff;}

  .buyBtn{width:100%;height:52px;background:var(--charcoal);color:var(--ivory-100);border:none;border-radius:0;font-family:'Archivo';font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
  .buyBtn:disabled{background:var(--bone-300);color:var(--text-disabled);cursor:not-allowed;}
  .buyBtn:not(:disabled):hover{background:var(--charcoal-700);}

  .footerLinks{display:flex;flex-wrap:wrap;gap:6px 14px;}
  .footerLinks button{font-size:13px;text-decoration:underline;text-underline-offset:2px;color:var(--charcoal);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;}

  .legal{font-size:12px;color:var(--text-tertiary);line-height:1.5;}
  .legal button{text-decoration:underline;background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0;}

  /* ---------- Saved addresses (Board §4) ---------- */
  .addrRest{border:1.5px solid var(--charcoal);border-radius:0;padding:14px;display:flex;gap:12px;align-items:flex-start;}
  .addrRest .lines{flex:1;display:flex;flex-direction:column;gap:3px;}
  .addrRest .nameRow{display:flex;align-items:center;gap:8px;}
  .addrRest .nameRow .n{font-weight:600;font-size:14px;}
  .addrRest .badge{background:var(--success-bg);color:var(--success);font-weight:600;font-size:10px;letter-spacing:.03em;padding:2px 7px;border-radius:2px;flex:none;}
  .addrRest .addrLine{font-size:13px;color:var(--text-secondary);}
  .addrRest .change{font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:2px;background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;flex:none;}
  .radioDot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--text-disabled);flex:none;position:relative;margin-top:1px;}
  .radioDot.on{border-color:var(--charcoal);}
  .radioDot.on::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--charcoal);}
  .addrPicker{display:flex;flex-direction:column;gap:10px;}
  .addrCard{border:1px solid var(--bone-100);border-radius:0;width:100%;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:#fff;}
  .addrCard.on{border:1.5px solid var(--charcoal);}
  .addrCard .lines{flex:1;display:flex;flex-direction:column;gap:3px;}
  .addrAddNew{border:1px dashed var(--bone-100);border-radius:0;padding:14px;display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--charcoal);font-weight:500;font-size:14px;background:none;width:100%;font-family:inherit;}
  .backLink{font-size:13px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:none;color:var(--text-secondary);font-family:inherit;padding:0;align-self:flex-start;}

  /* ---------- Toggle switch (real SPC checkout billing-same-as-shipping component) ---------- */
  .toggleRow{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;text-align:left;width:100%;}
  .toggleRow .track{width:38px;height:21px;border:1.5px solid var(--charcoal);border-radius:11px;position:relative;flex:none;background:#fff;transition:background .15s;}
  .toggleRow .track::before{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--charcoal);transition:transform .15s;}
  .toggleRow.on .track{background:var(--charcoal);}
  .toggleRow.on .track::before{background:#fff;transform:translateX(17px);}
  .toggleRow .lbl{font-size:14px;color:var(--charcoal);}

  /* ---------- Order summary (right col / mobile expanded) ---------- */
  .prod{display:flex;gap:16px;align-items:flex-start;max-width:400px;}
  .prod .thumbWrap{position:relative;flex:none;width:122px;}
  .prod .thumb{width:122px;height:162px;object-fit:cover;border-radius:2px;}
  .prod .saleBadge{position:absolute;left:6px;top:6px;background:var(--error);color:#fff;font-weight:700;font-size:10px;padding:3px 6px;border-radius:0;}
  .prod .meta{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .prod .titleRow{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14px;letter-spacing:-.3px;line-height:1.35;}
  .prod .titleRow .t{flex:1;}
  .prod .titleRow .p{white-space:nowrap;}
  .prod .priceStack{display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap;}
  .prod .priceStack .was{font-size:12px;color:var(--text-tertiary);text-decoration:line-through;}
  .prod .priceStack .now{font-weight:600;font-size:14px;color:var(--error);}
  .prod .desc{font-size:12px;color:var(--text-tertiary);line-height:1.4;}
  .prod .size{font-size:12px;color:var(--text-secondary);font-weight:500;}
  .prod .savedLine{font-size:12px;color:var(--error);font-weight:600;}
  .qtyStepper{display:inline-flex;align-items:center;border:1px solid var(--bone-100);border-radius:0;overflow:hidden;background:#fff;}
  .qtyStepper button{width:34px;height:34px;border:none;background:#fff;font-size:18px;color:var(--charcoal);cursor:pointer;}
  .qtyStepper button.minus:disabled{color:var(--text-disabled);cursor:not-allowed;}
  .qtyStepper .count{width:28px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;}
  .qtyRow{display:flex;align-items:center;justify-content:space-between;}
  .removeBtn{display:flex;gap:6px;align-items:center;font-weight:500;font-size:13px;color:var(--text-secondary);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;}
  .removeBtn svg{width:16px;height:16px;}
  .removeBtn:hover{color:var(--error);}
  .emptyCart{max-width:400px;display:flex;flex-direction:column;gap:8px;padding:20px 0;font-size:14px;color:var(--text-secondary);}
  .emptyCart button{align-self:flex-start;font-weight:600;text-decoration:underline;background:none;border:none;cursor:pointer;color:var(--charcoal);font-family:inherit;padding:0;}

  .discount{display:flex;gap:14px;max-width:400px;}
  .discount input{flex:1;height:47px;border:1px solid var(--bone-100);border-radius:var(--radius);padding:0 12px;font-family:'Archivo';font-size:14px;color:var(--charcoal);background:#fff;}
  .discount input:focus{outline:none;border:2px solid var(--charcoal);padding:0 11px;}
  .discount input::placeholder{color:var(--text-tertiary);}
  .discount .apply{height:47px;padding:0 22px;border:none;border-radius:0;background:var(--charcoal);font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;cursor:pointer;}
  .discount .apply:hover{background:var(--charcoal-700);}
  .discountErr{font-size:12px;color:var(--error);max-width:400px;}
  .discountChip{max-width:400px;display:flex;gap:8px;align-items:center;background:var(--success-bg);border:1px solid var(--success);border-radius:0;padding:10px 12px;}
  .discountChip .dot{background:var(--success);color:#fff;width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
  .discountChip .txt{flex:1;font-size:13px;color:var(--success);display:flex;gap:6px;align-items:center;}
  .discountChip .txt b{font-weight:700;}
  .discountChip .x{background:none;border:none;cursor:pointer;color:var(--success);font-weight:600;font-size:13px;}

  .totals{max-width:400px;display:flex;flex-direction:column;gap:12px;padding-top:6px;}
  .totRow{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--charcoal);}
  .totRow.was span:last-child{text-decoration:line-through;color:var(--text-tertiary);}
  .totRow.save span:last-child,.totRow.save span:first-child{color:var(--error);}
  .totRow .lft{display:flex;align-items:center;gap:6px;}
  .totRow .lft svg{width:15px;height:15px;color:var(--text-tertiary);}
  .infoBtn{display:inline-flex;background:none;border:none;padding:0;margin:0;cursor:pointer;color:inherit;line-height:0;}
  .tooltipWrap{position:relative;display:inline-flex;}
  .tooltipBubble{position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);background:var(--charcoal);color:var(--ivory-100);font-size:12px;font-weight:400;line-height:1.4;padding:8px 12px;white-space:nowrap;z-index:50;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s;letter-spacing:0;}
  .tooltipBubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--charcoal);}
  .tooltipWrap.open .tooltipBubble{opacity:1;visibility:visible;pointer-events:auto;}
  .grand{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--charcoal);padding-top:16px;margin-top:4px;}
  .grand .gl{font-family:'UtileDisplay',Georgia,serif;font-size:20px;font-weight:400;}
  .grand .gr{text-align:right;}
  .grand .gr .cur{font-size:12px;color:var(--text-tertiary);margin-right:6px;}
  .grand .gr .amt{font-family:'UtileDisplay',Georgia,serif;font-size:24px;font-weight:400;}
  .grand .gr .tax{font-size:12px;color:var(--text-tertiary);margin-top:2px;}

  /* ---------- Trust badges ---------- */
  .badges{display:flex;justify-content:space-between;gap:8px;max-width:420px;}
  .col-right .badges{border-top:1px solid var(--bone-200);padding-top:24px;}
  .trustItem{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .trustItem .ic{width:26px;height:26px;color:var(--charcoal-700);}
  .trustItem .bl{font-size:10px;line-height:1.25;color:var(--text-secondary);letter-spacing:-.1px;}

  /* ---------- Noch Fragen ---------- */
  .fragen{background:rgba(255,255,255,.5);border-radius:0;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:400px;}
  .fragen .ftitle{font-weight:700;font-size:14px;letter-spacing:-.3px;}
  .fragen .fsub{font-weight:500;font-size:14px;color:var(--text-secondary);text-align:center;letter-spacing:-.3px;}
  .fragen .fbody{font-size:12px;color:var(--text-tertiary);text-align:center;line-height:1.45;}
  .fragen .divl{width:288px;max-width:100%;height:1px;background:var(--bone-100);}
  .fragen .contact{display:flex;gap:24px;justify-content:center;}
  .fragen .contact a{display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;color:var(--text-secondary);text-decoration:underline;text-underline-offset:2px;}
  .fragen .contact svg{width:16px;height:16px;}
  .fragen .hours{font-size:12px;color:var(--text-tertiary);}

  /* ---------- Mobile order-summary bar ---------- */
  .obar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fbfbfb;border-bottom:1px solid var(--bone-200);cursor:pointer;border:none;width:100%;font-family:inherit;color:inherit;}
  .obar .l{display:flex;align-items:center;gap:8px;font-size:15px;}
  .obar .l svg{width:16px;height:16px;color:var(--charcoal);}
  .obar .amt{font-size:18px;font-weight:700;}

  /* ---------- Desktop two-column layout ---------- */
  .checkout{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:500px 1fr;align-items:stretch;background:#fff;}
  .col-left{padding:24px 32px 40px 32px;display:flex;flex-direction:column;gap:24px;}
  .col-right{position:relative;background:var(--bone-300);padding:24px 24px 40px 40px;display:flex;flex-direction:column;gap:24px;}
  .col-right::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:100vw;background:var(--bone-300);}

  /* ---------- Mobile single-column layout ---------- */
  .mwrap{width:390px;max-width:100%;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.14);border-radius:22px;overflow:hidden;}
  .mcol{padding:16px;display:flex;flex-direction:column;gap:22px;}
  .mcol .expressBtns .xbtn{max-width:none;}
  .mcol .section, .mcol .prod, .mcol .discount, .mcol .discountChip, .mcol .totals, .mcol .badges, .mcol .fragen, .mcol .emptyCart{max-width:none;}
  .mExpanded{border-top:1px solid var(--bone-200);padding-top:22px;display:flex;flex-direction:column;gap:20px;}
  .mExpanded .obarTop{display:flex;align-items:center;justify-content:space-between;background:none;border:none;width:100%;cursor:pointer;font-family:inherit;color:inherit;padding:0;}
  .mExpanded .obarTop .l{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;letter-spacing:-.4px;}
  .mExpanded .obarTop .l svg{width:18px;height:18px;}

  @media(max-width:1024px){
    .checkout{grid-template-columns:1fr;max-width:560px;}
    .col-right{display:none;}
  }
</style>

const UNIT_PRICE = 1990.00;
const SALE_PRICE = 1592.00;
const SHIPPING_FEE = 29;

function fmt(n){ return '€ '+n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function calc(){
  if(state.itemRemoved) return {lineSubtotal:0, regularSubtotal:0, discountAmt:0, shipping:0, total:0, tax:0};
  const unit = state.saleDemo ? SALE_PRICE : UNIT_PRICE;
  const regularUnit = UNIT_PRICE;
  const lineSubtotal = unit*state.qty;
  const regularSubtotal = regularUnit*state.qty;
  let discountAmt = 0;
  if(state.discountApplied) discountAmt = Math.round(lineSubtotal*(state.discountApplied.pct/100)*100)/100;
  const afterDiscount = lineSubtotal-discountAmt;
  const shipping = SHIPPING_FEE;
  const total = afterDiscount+shipping;
  const tax = Math.round(total/1.19*0.19*100)/100;
  return {lineSubtotal, regularSubtotal, discountAmt, shipping, total, tax, unit};
}

  const t=document.getElementById('toast');

}

}
const views={
  dv1:{fn:renderDesktopV1,mobile:false},
  mv1:{fn:renderMobileV1,mobile:true},
};
const stage=document.getElementById('stage');
function show(v){
  currentView=v;
  const cfg=views[v];
  stage.className='stage'+(cfg.mobile?' mobileStage':'');
  stage.innerHTML=cfg.fn();
  document.querySelectorAll('.switcher button[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
}
document.querySelectorAll('.switcher button[data-v]').forEach(b=>{
  b.addEventListener('click',()=>show(b.dataset.v));
});

/* ---------------- Interaction wiring (event delegation) ---------------- */
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.tooltipWrap')){
    document.querySelectorAll('.tooltipWrap.open').forEach(w=>w.classList.remove('open'));
  }
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;

  switch(act){
    case 'toggleSale':
      state.saleDemo = !state.saleDemo;
      t.classList.toggle('active', state.saleDemo);
      rerender();
      break;
    case 'resetState':
      state = JSON.parse(JSON.stringify(initialState));
      document.querySelector('[data-act="toggleSale"]').classList.remove('active');
      toast('Zurückgesetzt');
      rerender();
      break;
    case 'closePromo':
      state.promoVisible = false;
      rerender();
      break;
    case 'promoClick': {
      rerender();
      const el = document.getElementById('discountInput');
      if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.focus(); }
      toast('Code SUMMER10 unten eintragen und auf „Anwenden“ klicken');
      break;
    }
    case 'expressPay':
      toast(`Demo — ${t.dataset.method} würde jetzt den Express-Checkout starten`);
      break;
    case 'toggleLogin':
      state.loggedIn = !state.loggedIn;
      state.addressPickerOpen = false;
      state.addingNewAddress = false;
      rerender();
      break;
    case 'simulateAuth':
      state.loggedIn = true;
      toast(t.dataset.msg || 'Demo');
      rerender();
      break;
    case 'openAddressPicker':
      state.addressPickerOpen = true;
      rerender();
      break;
    case 'selectAddress':
      state.selectedAddressId = t.dataset.id;
      state.addressPickerOpen = false;
      rerender();
      break;
    case 'addNewAddress':
      state.addingNewAddress = true;
      state.addressPickerOpen = false;
      rerender();
      break;
    case 'backToSaved':
      state.addingNewAddress = false;
      rerender();
      break;
    case 'selectPayment':
      state.paymentMethod = t.dataset.method;
      rerender();
      break;
    case 'toggleBilling':
      state.billingSame = !state.billingSame;
      rerender();
      break;
    case 'qtyInc':
      state.qty = Math.min(state.qty+1, 9);
      rerender();
      break;
    case 'qtyDec':
      state.qty = Math.max(state.qty-1, 1);
      rerender();
      break;
    case 'removeItem':
      state.itemRemoved = true;
      rerender();
      break;
    case 'undoRemove':
      state.itemRemoved = false;
      rerender();
      break;
    case 'applyDiscount': {
      const input = document.getElementById('discountInput');
      const code = (input ? input.value : '').trim().toUpperCase();
      if(code==='SUMMER10'){
        state.discountApplied = {code:'SUMMER10', pct:10};
        state.discountError = '';
      } else {
        state.discountError = code ? 'Code ungültig. Versuch es mit SUMMER10.' : 'Bitte gib einen Code ein.';
      }
      rerender();
      break;
    }
    case 'removeDiscount':
      state.discountApplied = null;
      rerender();
      break;
    case 'toggleMobileOrder':
      state.mobileOrderOpen = !state.mobileOrderOpen;
      rerender();
      break;
    case 'buyNow':
      toast('Demo — hier würde die Bestellung jetzt ausgelöst');
      break;
    case 'legalNote':
      toast('Demo — verlinkt im echten Shop auf die jeweilige Seite');
      break;
    case 'shippingInfo': {
      const wrap = t.closest('.tooltipWrap');
      const wasOpen = wrap.classList.contains('open');
      document.querySelectorAll('.tooltipWrap.open').forEach(w=>w.classList.remove('open'));
      if(!wasOpen) wrap.classList.add('open');
      break;
    }
  }
});

show('dv1');
</script>
</body>
</html>
