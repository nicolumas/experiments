<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100f0e">
<title>Art Cloud · Desktop — LUMAS</title>
<style>
  @font-face{font-family:'Utile Display';src:url('https://cdn.lumas.de/assets/white/fonts/utile/utile-display-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'Archivo';src:url('https://cdn.lumas.de/assets/white/fonts/archivo.woff2') format('woff2');font-weight:300 700;font-style:normal;font-display:swap;}
  :root{
    --charcoal:#1C1A18; --charcoal-900:#100f0e; --charcoal-700:#5A5752;
    --ivory:#F4EDE2; --ivory-300:#FAF6F1; --bone:#E2D8CC;
    --field:#0c0b0a;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --z-scrim:20; --z-sheet:30; --z-controls:40; --z-hint:50;
    font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--field);color:var(--ivory);overflow:hidden;}
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  .exp{position:fixed;inset:0;overflow:clip;background:
    radial-gradient(130% 90% at 50% 42%, #17150f 0%, var(--field) 62%, #080706 100%);}
  .exp canvas.cloud{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(135% 100% at 50% 46%, transparent 52%, rgba(6,5,4,.72) 100%);}

  /* ---- top chrome ---- */
  .brand{position:absolute;top:26px;left:30px;z-index:var(--z-controls);line-height:0;}
  .brand svg{height:18px;width:auto;display:block;fill:var(--ivory);}
  .search{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:var(--z-controls);
    display:flex;align-items:center;gap:11px;width:min(38vw,440px);height:46px;padding:0 18px;border-radius:999px;
    background:rgba(18,16,14,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(244,237,226,.14);transition:border-color .2s,background .2s;}
  .search:focus-within{border-color:rgba(244,237,226,.34);background:rgba(22,20,17,.78);}
  .search svg{width:17px;height:17px;color:rgba(244,237,226,.55);flex:none;}
  .search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ivory);font-size:15px;}
  .search input::placeholder{color:rgba(244,237,226,.45);}
  .search .clear{display:none;color:rgba(244,237,226,.55);font-size:19px;padding:2px 4px;}
  .search.filled .clear{display:block;}
  .matchpill{position:absolute;top:80px;left:50%;transform:translateX(-50%) translateY(-6px);z-index:var(--z-controls);
    padding:6px 15px;border-radius:999px;font-size:11.5px;letter-spacing:.04em;font-weight:700;
    background:rgba(244,237,226,.94);color:var(--charcoal);opacity:0;pointer-events:none;
    transition:opacity .25s var(--ease-out),transform .25s var(--ease-out);}
  .matchpill.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- bottom-right tools: zoom + recenter ---- */
  .tools{position:absolute;right:28px;bottom:30px;z-index:var(--z-controls);display:flex;flex-direction:column;gap:8px;}
  .tool{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(18,16,14,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(244,237,226,.15);color:var(--ivory);transition:transform .16s var(--ease-out),background .2s;}
  .tool:hover{background:rgba(30,27,23,.8);}
  .tool:active{transform:scale(.92);}
  .tool svg{width:19px;height:19px;}
  .tool.zoom{font-size:22px;font-weight:300;line-height:1;}

  /* ---- mouse-mode switcher (stakeholder testing) ---- */
  .modebar{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:var(--z-controls);
    display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;}
  .modebar-row{display:flex;align-items:center;gap:12px;pointer-events:auto;max-width:94vw;
    background:rgba(14,13,11,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(244,237,226,.12);border-radius:999px;padding:7px 8px 7px 18px;box-shadow:0 12px 40px -18px rgba(0,0,0,.8);}
  .modebar-label{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,237,226,.5);white-space:nowrap;}
  .seg{display:inline-flex;flex-wrap:wrap;justify-content:center;background:rgba(244,237,226,.06);border-radius:22px;padding:3px;gap:2px;}
  .seg button{padding:8px 15px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.03em;
    color:rgba(244,237,226,.62);transition:color .2s,background .2s;white-space:nowrap;}
  .seg button:hover{color:var(--ivory);}
  .seg button[aria-pressed="true"]{background:var(--ivory);color:var(--charcoal);}
  .modebar-desc{font-size:12px;color:rgba(244,237,226,.55);letter-spacing:.01em;text-align:center;
    background:rgba(12,11,10,.5);padding:4px 12px;border-radius:999px;pointer-events:none;max-width:70vw;}

  /* ---- transient hint ---- */
  .hint{position:absolute;left:50%;top:82px;transform:translateX(-50%);z-index:var(--z-hint);
    font-size:12.5px;color:rgba(244,237,226,.7);pointer-events:none;transition:opacity .6s var(--ease-out);}
  .hint.gone{opacity:0;}


  /* ---- detail (centered, floats on dimmed cloud) ---- */
  .scrim{position:fixed;inset:0;z-index:var(--z-scrim);background:rgba(6,5,4,0);
    opacity:0;visibility:hidden;transition:opacity .45s var(--ease-out),visibility .45s;pointer-events:none;}
  .scrim.show{opacity:1;visibility:visible;background:rgba(6,5,4,.82);pointer-events:auto;}

  .sheet{position:fixed;z-index:var(--z-sheet);left:50%;top:50%;transform:translate(-50%,-47%);
    display:flex;flex-direction:column;align-items:center;gap:22px;width:min(92vw,880px);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .42s var(--ease-out),transform .5s var(--ease-out),visibility .42s;}
  .sheet.show{opacity:1;visibility:visible;transform:translate(-50%,-50%);pointer-events:auto;}
  .sheet-hero{display:flex;align-items:center;justify-content:center;}
  .sheet-hero img{max-width:min(88vw,760px);max-height:64vh;width:auto;height:auto;object-fit:contain;display:block;
    box-shadow:0 48px 120px -38px rgba(0,0,0,.92);}
  /* minimal caption line: ARTIST  Title ↗ (links to the PDP) */
  .sheet-caption{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ivory);}
  .sheet-artist{font-size:12px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--ivory);}
  .sheet-title{font-family:'Utile Display',Georgia,serif;font-weight:400;font-size:18px;color:rgba(244,237,226,.82);transition:color .2s;}
  .sheet-caption svg{width:13px;height:13px;opacity:.6;transition:transform .2s var(--ease-out),opacity .2s;}
  .sheet-caption:hover .sheet-title{color:var(--ivory);}
  .sheet-caption:hover svg{opacity:1;transform:translate(2px,-2px);}
  .btn-similar{height:48px;padding:0 28px;border-radius:6px;border:1px solid rgba(244,237,226,.28);background:transparent;
    color:var(--ivory);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    display:inline-flex;align-items:center;justify-content:center;transition:transform .16s var(--ease-out),background .2s,border-color .2s;}
  .btn-similar:hover{background:rgba(244,237,226,.09);border-color:rgba(244,237,226,.5);}
  .btn-similar:active{transform:scale(.98);}
  /* wishlist + close, top-right while a work is open */
  .detail-top{position:fixed;top:22px;right:28px;z-index:calc(var(--z-sheet) + 1);display:flex;gap:10px;
    opacity:0;visibility:hidden;transition:opacity .3s var(--ease-out),visibility .3s;}
  .exp.detail-open .detail-top{opacity:1;visibility:visible;}
  .exp.detail-open .modebar,.exp.detail-open .tools{opacity:0;pointer-events:none;transition:opacity .3s var(--ease-out);}
  .btn-ghost,.detail-close{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(16,15,14,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(244,237,226,.16);color:var(--ivory);transition:transform .16s var(--ease-out),background .2s;}
  .btn-ghost:hover,.detail-close:hover{background:rgba(30,27,23,.85);}
  .btn-ghost:active,.detail-close:active{transform:scale(.92);}
  .btn-ghost svg{width:19px;height:19px;} .detail-close svg{width:16px;height:16px;}
  .btn-ghost.liked svg{fill:var(--ivory);}

  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important;} }
</style>
</head>
<body>
<div class="exp" data-mode="desktop">
  <canvas class="cloud"></canvas>
  <div class="vignette"></div>

  <a class="brand" href="#" aria-label="LUMAS" onclick="return false">
    <svg viewBox="0 0 160 30" role="img" aria-label="LUMAS"><g>
      <path d="M8.1,0.9v20.5h12.1v6.8H0.4V0.9H8.1z"/>
      <path d="M34.9,28.9c-3.6,0-6.6-1-8.8-2.9c-2.3-1.9-3.5-4.7-3.5-8.2V0.9h7.7v17c0,1.4,0.4,2.5,1.2,3.3c0.8,0.8,1.9,1.2,3.4,1.2s2.6-0.4,3.4-1.2c0.8-0.8,1.2-1.9,1.2-3.3v-17h7.7v16.9c0,3.6-1.1,6.4-3.3,8.3C41.6,28,38.6,28.9,34.9,28.9z"/>
      <path d="M68.1,11.3l2.6-10.4h11.8v27.4h-7.3v-7.8c0-5,0.1-9.3,0.2-12.8c-0.6,2.3-1.1,4.3-1.6,6.1l-4,14.5h-6.2l-4-14.5C59.1,12,58.6,10,58,7.7c0.2,3.5,0.2,7.8,0.2,12.8v7.8h-7.3V0.9h11.8l2.6,10.4c0.7,2.7,1.1,4.6,1.4,5.9C66.9,15.9,67.4,14,68.1,11.3z"/>
      <path d="M114.1,28.3h-8.2l-1.2-3.6H94l-1.2,3.6H85l9.7-27.4h9.2L114.1,28.3z M98,12.1l-2,6.3h6.7l-2-6.3c-0.7-2.2-1.2-3.7-1.3-4.3C98.7,9.9,98.3,11.3,98,12.1z"/>
      <path d="M126.1,28.9c-3.9,0-6.9-0.9-9.1-2.6c-2.1-1.7-3.2-4.1-3.2-7h7.4c0,1.4,0.4,2.4,1.3,3c0.8,0.5,2.1,0.8,3.9,0.8c2.6,0,3.8-0.8,3.8-2.5c0-0.8-0.3-1.3-0.9-1.7c-0.6-0.4-1.7-0.7-3.4-1l-2.2-0.3c-6.3-1-9.5-4-9.5-8.8c0-2.6,1-4.6,2.9-6.2c1.9-1.5,4.7-2.3,8.3-2.3c3.6,0,6.5,0.8,8.5,2.3c2,1.5,3.1,3.8,3.2,6.8H130c-0.1-1.1-0.4-1.9-1.1-2.4c-0.7-0.5-1.8-0.8-3.2-0.8c-2.3,0-3.5,0.8-3.5,2.3c0,0.8,0.3,1.3,0.9,1.7c0.6,0.4,1.6,0.7,3.1,1l2.3,0.4c3.4,0.6,5.9,1.5,7.4,2.9c1.6,1.3,2.3,3.2,2.3,5.7c0,2.9-1.1,5.1-3.2,6.6C132.8,28.2,129.9,28.9,126.1,28.9z"/>
      <path d="M140.7,6.6V0.7H159v11.9h-6.4v-6H140.7z"/>
    </g></svg>
  </a>

  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" placeholder="Search artworks or artists…" autocomplete="off" spellcheck="false">
    <button class="clear" aria-label="Clear search" type="button">×</button>
  </label>
  <div class="matchpill"></div>

  <div class="hint">Hover a work, click to view</div>

  <div class="tools">
    <button class="tool zoom zoom-in" aria-label="Zoom in">+</button>
    <button class="tool zoom zoom-out" aria-label="Zoom out">−</button>
    <button class="tool recenter-btn" aria-label="Back to overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4.5"/></svg>
    </button>
  </div>

  <div class="modebar">
    <div class="modebar-row">
      <span class="modebar-label">Mouse control</span>
      <div class="seg" role="group" aria-label="Mouse control">
        <button data-m="drag" aria-pressed="true">Drag</button>
        <button data-m="glide" aria-pressed="false">Glide</button>
        <button data-m="scroll" aria-pressed="false">Scroll</button>
        <button data-m="schwung" aria-pressed="false">Momentum</button>
        <button data-m="ambient" aria-pressed="false">Ambient</button>
        <button data-m="reise" aria-pressed="false">Travel</button>
        <button data-m="sway" aria-pressed="false">Sway</button>
        <button data-m="tour" aria-pressed="false">Tour</button>
        <button data-m="snap" aria-pressed="false">Snap</button>
      </div>
    </div>
    <span class="modebar-desc"></span>
  </div>

  <div class="scrim"></div>

  <div class="sheet" role="dialog" aria-label="Artwork">
    <div class="sheet-hero"><img alt=""></div>
    <a class="sheet-caption" target="_blank" rel="noopener" aria-label="View artwork">
      <span class="sheet-artist"></span>
      <span class="sheet-title"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg>
    </a>
    <button class="btn-similar similar-btn-sheet">More in this style</button>
  </div>

  <div class="detail-top">
    <button class="btn-ghost like-btn" aria-label="Add to wishlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    </button>
    <button class="detail-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

</div>

<script src="art-cloud-mobile-data.js"></script>
<script>
(function(){
  "use strict";
  const RAW = window.ARTCLOUD_DATA || [];
  const PDP_BASE = "https://www.lumas.de";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const DESC = {
    drag:   "Click and drag to move · scroll wheel zooms",
    glide:  "The mouse gently steers. Toward the edges for speed, the centre rests · scroll wheel zooms",
    scroll: "Scrolling moves the plane · ⌘ / Ctrl + scroll zooms",
    schwung:"Drag and let go. The plane keeps gliding with momentum · scroll wheel zooms",
    ambient:"Sit back. The collection drifts slowly past · hover a work, click to view",
    reise:  "Click anywhere to glide there · click a work to view",
    sway:   "The view leans toward your cursor and springs back. A gentle peek around · scroll wheel zooms",
    tour:   "A guided walk. The view moves from work to work on its own · hover or click a work",
    snap:   "Drag to move; on release the view settles onto the nearest work · scroll wheel zooms"
  };
  function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0);}

  function Experience(root){
    const canvas = root.querySelector('canvas.cloud');
    const ctx = canvas.getContext('2d');
    const search = root.querySelector('.search input');
    const searchWrap = root.querySelector('.search');
    const matchpill = root.querySelector('.matchpill');
    const hint = root.querySelector('.hint');
    const scrim = root.querySelector('.scrim');
    const sheet = root.querySelector('.sheet');

    let W=0,H=0;
    let mouseMode='drag';

    // ----- cloud model (golden-angle spiral + box-relaxation, ≤5% overlap, airy) -----
    const GOLDEN = Math.PI*(3-Math.sqrt(5));
    const arts = RAW.map((d,i)=>{
      const seed = hash(d.id);
      const size = 150 * (0.72 + (seed%1000)/1000*0.72);
      const r = 104*Math.sqrt(i+0.6);
      const ang = i*GOLDEN;
      const jx = ((seed%200)-100), jy = (((seed>>8)%200)-100);
      return {d, wx:Math.cos(ang)*r+jx*0.6, wy:Math.sin(ang)*r+jy*0.6, size, img:null, state:'idle', aspect:1, dim:1, targetDim:1, hoverT:0};
    });
    (function relax(){
      const half = arts.map(a=>a.size*2.3/2);   // airy desktop spacing — big gaps between works
      for(let pass=0; pass<220; pass++){
        let moved=false;
        for(let i=0;i<arts.length;i++){
          for(let j=i+1;j<arts.length;j++){
            const dx=arts[j].wx-arts[i].wx, dy=arts[j].wy-arts[i].wy;
            const reach=half[i]+half[j];
            const ox=reach-Math.abs(dx), oy=reach-Math.abs(dy);
            if(ox<=0||oy<=0) continue;
            const tol=0.05*Math.min(arts[i].size,arts[j].size);
            if(Math.min(ox,oy)<=tol) continue;
            if(ox<oy){ const push=(ox-tol)/2*(dx<0?-1:1); arts[i].wx-=push; arts[j].wx+=push; }
            else     { const push=(oy-tol)/2*(dy<0?-1:1); arts[i].wy-=push; arts[j].wy+=push; }
            moved=true;
          }
        }
        if(!moved) break;
      }
    })();
    const byId = new Map();
    arts.forEach(a=>{ a.ox=a.wx; a.oy=a.wy; a.tx=a.wx; a.ty=a.wy; byId.set(a.d.id, a); });
    const bx = arts.map(a=>a.wx), by = arts.map(a=>a.wy);
    const bounds = {minX:Math.min(...bx), maxX:Math.max(...bx), minY:Math.min(...by), maxY:Math.max(...by)};
    const homeCx=(bounds.minX+bounds.maxX)/2, homeCy=(bounds.minY+bounds.maxY)/2;
    const HOME_S=0.6;

    const cam = {x:homeCx, y:homeCy, s:HOME_S};
    let tween=null, vel={x:0,y:0}, drift=0, moving=false, similarSeed=null, driftAng=0.6, ambientAng=0.4;
    const S_MIN=0.28, S_MAX=2.8;

    function resize(){
      const r = root.getBoundingClientRect();
      W = r.width; H = r.height;
      canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
      ctx.setTransform(DPR,0,0,DPR,0,0);
      requestRender();
    }

    const toScreenX = wx => W/2 + (wx-cam.x)*cam.s;
    const toScreenY = wy => H/2 + (wy-cam.y)*cam.s;
    const toWorldX = sx => cam.x + (sx-W/2)/cam.s;
    const toWorldY = sy => cam.y + (sy-H/2)/cam.s;

    function ensureImg(a){
      if(a.state!=='idle') return;
      a.state='loading';
      const im = new Image(); im.decoding='async';
      im.onload=()=>{a.img=im;a.state='loaded';a.aspect=im.naturalWidth/im.naturalHeight||1;requestRender();};
      im.onerror=()=>{a.state='error';};
      im.src=a.d.img;
    }

    // ----- search -----
    let query='';
    function applyQuery(q){
      query=q.trim().toLowerCase();
      searchWrap.classList.toggle('filled', !!query);
      if(query && similarSeed){ arts.forEach(a=>{a.tx=a.ox;a.ty=a.oy;}); similarSeed=null; moving=true; }
      if(!query){ arts.forEach(a=>a.targetDim=1); matchpill.classList.remove('show'); requestRender(); return; }
      const matches=[];
      arts.forEach(a=>{ const hit=(a.d.t+' '+a.d.a).toLowerCase().includes(query); a.targetDim=hit?1:0.1; if(hit)matches.push(a); });
      matchpill.textContent = matches.length? `${matches.length} Treffer` : 'Keine Treffer';
      matchpill.classList.add('show');
      if(matches.length) flyToFit(matches);
      requestRender();
    }
    function flyToFit(list){
      const xs=list.map(a=>a.wx), ys=list.map(a=>a.wy), pad=180;
      const minX=Math.min(...xs)-pad,maxX=Math.max(...xs)+pad,minY=Math.min(...ys)-pad,maxY=Math.max(...ys)+pad;
      const spanX=Math.max(maxX-minX,220), spanY=Math.max(maxY-minY,220);
      let s=Math.max(S_MIN,Math.min(S_MAX,Math.min(W/spanX,H/spanY)));
      flyTo((minX+maxX)/2,(minY+maxY)/2,s);
    }
    function flyTo(x,y,s){ vel.x=vel.y=0; drift=0; if(reduceMotion){cam.x=x;cam.y=y;cam.s=s;requestRender();return;} tween={x,y,s}; requestRender(); }
    function clampCam(){
      const mx=(bounds.maxX-bounds.minX)/2+360, my=(bounds.maxY-bounds.minY)/2+360;
      cam.x=Math.max(homeCx-mx,Math.min(homeCx+mx,cam.x));
      cam.y=Math.max(homeCy-my,Math.min(homeCy+my,cam.y));
    }

    // ----- "more in this style" re-cluster -----
    function relaxTargets(list){
      const half=list.map(a=>a.size*1.16/2);
      for(let pass=0;pass<130;pass++){ let mv=false;
        for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
          const dx=list[j].tx-list[i].tx, dy=list[j].ty-list[i].ty;
          const reach=half[i]+half[j], ox=reach-Math.abs(dx), oy=reach-Math.abs(dy);
          if(ox<=0||oy<=0) continue;
          const tol=0.05*Math.min(list[i].size,list[j].size);
          if(Math.min(ox,oy)<=tol) continue;
          if(ox<oy){ const p=(ox-tol)/2*(dx<0?-1:1); list[i].tx-=p; list[j].tx+=p; }
          else     { const p=(oy-tol)/2*(dy<0?-1:1); list[i].ty-=p; list[j].ty+=p; }
          mv=true;
        }
        if(!mv) break;
      }
    }
    function similarOf(seed){
      const set=new Set(), out=[];
      (seed.d.s||[]).forEach(id=>{ const a=byId.get(id); if(a&&a!==seed&&!set.has(a)){out.push(a);set.add(a);} });
      if(out.length<8) arts.forEach(a=>{ if(a!==seed&&!set.has(a)&&a.d.a===seed.d.a){out.push(a);set.add(a);} });
      if(out.length<8) arts.filter(a=>a!==seed&&!set.has(a))
        .map(a=>({a,dd:(a.ox-seed.ox)**2+(a.oy-seed.oy)**2})).sort((p,q)=>p.dd-q.dd)
        .slice(0,12-out.length).forEach(p=>{out.push(p.a);set.add(p.a);});
      return out.slice(0,24);
    }
    function layoutSimilar(seed){
      const sims=similarOf(seed), cluster=[seed,...sims], cset=new Set(cluster);
      seed.tx=homeCx; seed.ty=homeCy;
      sims.forEach((a,i)=>{ const r=120*Math.sqrt(i+0.8), ang=(i+1)*GOLDEN; a.tx=homeCx+Math.cos(ang)*r; a.ty=homeCy+Math.sin(ang)*r; });
      relaxTargets(cluster);
      arts.filter(a=>!cset.has(a)).forEach((a,i)=>{ const ang=i*GOLDEN, r=2800+((i*57)%1100); a.tx=homeCx+Math.cos(ang)*r; a.ty=homeCy+Math.sin(ang)*r; a.targetDim=0.1; });
      cluster.forEach(a=>a.targetDim=1);
      similarSeed=seed; moving=true;
      let mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9;
      cluster.forEach(a=>{const h=a.size/2;mnX=Math.min(mnX,a.tx-h);mxX=Math.max(mxX,a.tx+h);mnY=Math.min(mnY,a.ty-h);mxY=Math.max(mxY,a.ty+h);});
      const s=Math.max(S_MIN,Math.min(S_MAX,Math.min(W/Math.max(mxX-mnX,220),H/Math.max(mxY-mnY,220))*0.86));
      flyTo(homeCx,homeCy,s); requestRender();
    }
    function layoutFull(){ arts.forEach(a=>{ a.tx=a.ox; a.ty=a.oy; a.targetDim=1; }); similarSeed=null; moving=true; flyTo(homeCx,homeCy,HOME_S); requestRender(); }

    // ----- render loop -----
    let running=false, idleFrames=0, frameTick=0;
    function requestRender(){ if(!running){running=true;idleFrames=0;requestAnimationFrame(frame);} }
    function frame(){
      frameTick++;
      let active=false;

      // intro drift (until first interaction; not in Ambient, which has its own)
      if(drift>0.001 && !down && mouseMode!=='ambient'){ cam.x+=Math.cos(driftAng)*drift/cam.s; cam.y+=Math.sin(driftAng)*drift/cam.s; driftAng+=0.0009; active=true; }
      // AMBIENT mode: slow, continuous cinematic drift on a gently curving path
      if(mouseMode==='ambient' && !down && !tween && !moving){
        cam.x+=Math.cos(ambientAng)*0.8/cam.s; cam.y+=Math.sin(ambientAng)*0.8/cam.s; ambientAng+=0.0016; active=true;
      }
      // TOUR mode: a guided walk that moves from work to work on its own
      if(mouseMode==='tour' && !selected && !moving){
        if(tween) tourNext=0;
        else if(tourNext===0) tourNext=performance.now()+2600;
        else if(performance.now()>=tourNext){ tourStep(); tourNext=0; }
        active=true;
      }
      // SWAY mode: bounded parallax that leans toward the cursor and springs back
      if(mouseMode==='sway' && !down && !tween && !moving){
        const MAX=260/cam.s;
        const tx=mouse.inside?((mouse.x-W/2)/(W/2))*MAX:0, ty=mouse.inside?((mouse.y-H/2)/(H/2))*MAX:0;
        const nx=swayOff.x+(tx-swayOff.x)*0.1, ny=swayOff.y+(ty-swayOff.y)*0.1;
        cam.x+=(nx-swayOff.x); cam.y+=(ny-swayOff.y); swayOff.x=nx; swayOff.y=ny;
        if(Math.abs(tx-swayOff.x)>0.4||Math.abs(ty-swayOff.y)>0.4) active=true;
      }
      // GLIDE mode: mouse position steers, with a calm dead-zone in the centre
      if(mouseMode==='glide' && mouse.inside && !down && !tween && !moving && drift<=0.001){
        const nx=(mouse.x-W/2)/(W/2), ny=(mouse.y-H/2)/(H/2), mag=Math.hypot(nx,ny), dz=0.14;
        if(mag>dz){ const k=Math.min((mag-dz)/(0.92-dz),1), sp=6.2*Math.pow(k,1.7);
          cam.x+=(nx/mag)*sp/cam.s; cam.y+=(ny/mag)*sp/cam.s; active=true; }
      }
      // momentum: quick stop for Drag/Scroll, long floaty glide for Momentum mode
      if(!down && (Math.abs(vel.x)>0.02||Math.abs(vel.y)>0.02)){
        const dcy = (mouseMode==='schwung')?0.975:0.9;
        cam.x+=vel.x; cam.y+=vel.y; vel.x*=dcy; vel.y*=dcy; active=true;
      }
      // eased fly (zoom buttons, search, recenter, similar)
      if(tween){
        cam.x+=(tween.x-cam.x)*0.14; cam.y+=(tween.y-cam.y)*0.14; cam.s+=(tween.s-cam.s)*0.14;
        if(Math.abs(tween.x-cam.x)<0.5&&Math.abs(tween.y-cam.y)<0.5&&Math.abs(tween.s-cam.s)<0.002){ cam.x=tween.x;cam.y=tween.y;cam.s=tween.s;tween=null; } else active=true;
      }
      // dim + hover easing
      for(const a of arts){
        if(Math.abs(a.dim-a.targetDim)>0.005){a.dim+=(a.targetDim-a.dim)*0.18;active=true;} else a.dim=a.targetDim;
        const ht=(a===hovered)?1:0; if(Math.abs(a.hoverT-ht)>0.01){a.hoverT+=(ht-a.hoverT)*0.2;active=true;} else a.hoverT=ht;
      }
      // re-cluster position animation
      if(moving){ let settled=true;
        for(const a of arts){ const dx=a.tx-a.wx, dy=a.ty-a.wy; if(Math.abs(dx)>0.5||Math.abs(dy)>0.5){a.wx+=dx*0.16;a.wy+=dy*0.16;settled=false;} else {a.wx=a.tx;a.wy=a.ty;} }
        if(settled) moving=false; else active=true;
      }
      if(!down&&!tween&&!moving&&mouseMode!=='glide'&&mouseMode!=='sway') clampCam();
      else if(mouseMode==='glide'&&!tween&&!moving) clampCam();

      draw();
      if(active){ idleFrames=0; requestAnimationFrame(frame); }
      else { idleFrames++; if(idleFrames<3){requestAnimationFrame(frame);} else {running=false;} }
    }

    function drawTile(a){
      const sx=toScreenX(a.wx), sy=toScreenY(a.wy);
      const lift=1+0.06*a.hoverT;
      const long=a.size*cam.s*lift;
      let w,h;
      if(a.state==='loaded'){ if(a.aspect>=1){w=long;h=long/a.aspect;} else {h=long;w=long*a.aspect;} } else {w=long;h=long;}
      const x=sx-w/2, y=sy-h/2;
      ctx.globalAlpha=a.dim;
      if(a.state==='loaded'){
        ctx.save();
        ctx.shadowColor='rgba(0,0,0,'+((0.5+0.35*a.hoverT)*a.dim)+')';
        ctx.shadowBlur=(20+40*a.hoverT)*Math.min(cam.s,1.5); ctx.shadowOffsetY=(9+10*a.hoverT)*Math.min(cam.s,1.5);
        ctx.fillStyle='#0b0a09'; ctx.fillRect(x,y,w,h);
        ctx.restore();
        ctx.drawImage(a.img,x,y,w,h);
        if(a===selected){ ctx.strokeStyle='#FAF6F1'; ctx.lineWidth=2; ctx.strokeRect(x-1,y-1,w+2,h+2); }
      } else { ctx.fillStyle='rgba(244,237,226,0.05)'; ctx.fillRect(x,y,w,h); }
      ctx.globalAlpha=1;
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      const margin=200;
      for(const a of arts){
        const sx=toScreenX(a.wx), sy=toScreenY(a.wy);
        if(sx<-margin||sx>W+margin||sy<-margin||sy>H+margin) continue;
        ensureImg(a);
        if(a!==hovered) drawTile(a);
      }
      if(hovered){ const sx=toScreenX(hovered.wx), sy=toScreenY(hovered.wy);
        if(sx>=-margin&&sx<=W+margin&&sy>=-margin&&sy<=H+margin) drawTile(hovered); }  // hovered on top
    }

    // ----- mouse handling (3 modes) -----
    const mouse={x:0,y:0,inside:false};
    let down=false, last={x:0,y:0}, moved=0, downT=0, hovered=null, panning=false;
    let swayOff={x:0,y:0}, tourSeq=null, tourIdx=-1, tourNext=0;
    function tourStep(){
      if(!tourSeq) tourSeq=arts.filter((_,i)=>i%7===0);
      tourIdx=(tourIdx+1)%tourSeq.length; const a=tourSeq[tourIdx];
      flyTo(a.wx,a.wy,Math.max(S_MIN,Math.min(1.4,(H*0.5)/a.size)));
    }

    function firstInteraction(){ drift=0; if(hint&&!hint.classList.contains('gone')) hint.classList.add('gone'); }
    function hitLocal(px,py){
      for(let i=arts.length-1;i>=0;i--){ const a=arts[i]; if(a.dim<0.3) continue;
        const sx=toScreenX(a.wx), sy=toScreenY(a.wy); const long=a.size*cam.s; let w,h;
        if(a.state==='loaded'){ if(a.aspect>=1){w=long;h=long/a.aspect;}else{h=long;w=long*a.aspect;} } else {w=long;h=long;}
        if(px>=sx-w/2&&px<=sx+w/2&&py>=sy-h/2&&py<=sy+h/2) return a; }
      return null;
    }
    function setCursor(){
      if(down&&panning){ canvas.style.cursor='grabbing'; return; }
      if(hovered){ canvas.style.cursor='pointer'; return; }
      canvas.style.cursor = (mouseMode==='drag'||mouseMode==='schwung'||mouseMode==='snap') ? 'grab' : (mouseMode==='reise' ? 'crosshair' : 'default');
    }
    function updateHover(){ const a = (down&&panning)?hovered:hitLocal(mouse.x,mouse.y); if(a!==hovered){ hovered=a; requestRender(); } setCursor(); }

    canvas.addEventListener('pointerdown',e=>{
      if(e.button!==0) return;
      firstInteraction(); tween=null; vel.x=vel.y=0;
      down=true; downT=performance.now(); moved=0; last={x:e.clientX,y:e.clientY};
      panning = (mouseMode==='drag'||mouseMode==='scroll'||mouseMode==='schwung'||mouseMode==='snap');
      if(panning){ try{canvas.setPointerCapture(e.pointerId);}catch(_){} }
      setCursor(); requestRender();
    });
    canvas.addEventListener('pointermove',e=>{
      const rect=canvas.getBoundingClientRect();
      mouse.x=e.clientX-rect.left; mouse.y=e.clientY-rect.top; mouse.inside=true;
      if(drift>0.001) firstInteraction();   // any mouse movement ends the intro drift (lets Glide take over)
      if(down&&panning){
        const dx=e.clientX-last.x, dy=e.clientY-last.y;
        moved+=Math.abs(dx)+Math.abs(dy);
        cam.x-=dx/cam.s; cam.y-=dy/cam.s; vel.x=-dx/cam.s; vel.y=-dy/cam.s;
        last={x:e.clientX,y:e.clientY};
        requestRender();
      } else { updateHover(); if(mouseMode==='glide') requestRender(); }
    });
    window.addEventListener('pointerup',e=>{
      if(!down) return;
      const dt=performance.now()-downT;
      if(moved<8 && dt<400){
        const a=hitLocal(mouse.x,mouse.y);
        if(a) select(a);
        else if(mouseMode==='reise'){ flyTo(toWorldX(mouse.x), toWorldY(mouse.y), Math.min(S_MAX, cam.s*1.25)); }  // travel to the click
      } else if(mouseMode==='schwung' && panning){ vel.x*=1.7; vel.y*=1.7; }   // extra floaty fling
      else if(mouseMode==='snap' && panning){                                  // magnetic: settle on the nearest work
        vel.x=vel.y=0; let best=null,bd=Infinity;
        for(const a of arts){ if(a.dim<0.5) continue; const d=(a.wx-cam.x)**2+(a.wy-cam.y)**2; if(d<bd){bd=d;best=a;} }
        if(best) flyTo(best.wx,best.wy,cam.s);
      }
      down=false; panning=false; updateHover(); requestRender();
    });
    canvas.addEventListener('pointerleave',()=>{ mouse.inside=false; if(hovered){hovered=null;requestRender();} canvas.style.cursor=''; });

    canvas.addEventListener('wheel',e=>{
      e.preventDefault(); firstInteraction(); tween=null;
      const rect=canvas.getBoundingClientRect();
      if(mouseMode==='scroll' && !e.ctrlKey && !e.metaKey){
        cam.x+=e.deltaX/cam.s; cam.y+=e.deltaY/cam.s;
        vel.x=(e.deltaX/cam.s)*0.28; vel.y=(e.deltaY/cam.s)*0.28;
      } else {
        const fx=e.clientX-rect.left, fy=e.clientY-rect.top;
        const wx=toWorldX(fx), wy=toWorldY(fy);
        let ns=cam.s*(e.deltaY<0?1.10:0.905); ns=Math.max(S_MIN,Math.min(S_MAX,ns));
        cam.s=ns; cam.x=wx-(fx-W/2)/cam.s; cam.y=wy-(fy-H/2)/cam.s;
      }
      requestRender();
    },{passive:false});

    function zoomBy(f){ let ns=Math.max(S_MIN,Math.min(S_MAX,cam.s*f)); tween={x:cam.x,y:cam.y,s:ns}; firstInteraction(); requestRender(); }

    // ----- detail -----
    let selected=null, prevCam=null;
    function select(a){
      selected=a; prevCam={...cam};
      const im=sheet.querySelector('.sheet-hero img');
      im.onerror=()=>{ im.onerror=null; im.src=a.d.img; };
      im.src=a.d.img.replace('_mobile.jpg','_desktop.jpg'); im.alt=a.d.t;
      sheet.querySelector('.sheet-title').textContent=a.d.t;
      sheet.querySelector('.sheet-artist').textContent=a.d.a;
      sheet.querySelector('.sheet-caption').href=PDP_BASE+a.d.u;
      root.querySelector('.like-btn').classList.remove('liked');
      root.classList.add('detail-open');
      scrim.classList.add('show'); sheet.classList.add('show');
      requestRender();
    }
    function deselect(){ if(!selected) return; root.classList.remove('detail-open'); scrim.classList.remove('show'); sheet.classList.remove('show'); selected=null; prevCam=null; if(mouseMode==='tour') tourNext=performance.now()+1400; requestRender(); }
    scrim.addEventListener('click',deselect);
    root.querySelector('.detail-close').addEventListener('click',deselect);
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') deselect(); });

    // ----- controls -----
    root.querySelector('.recenter-btn').addEventListener('click',()=>{
      deselect(); search.value=''; searchWrap.classList.remove('filled'); matchpill.classList.remove('show');
      arts.forEach(a=>a.targetDim=1); layoutFull();
    });
    root.querySelector('.similar-btn-sheet').addEventListener('click',()=>{ const seed=selected; deselect(); if(seed) layoutSimilar(seed); });
    root.querySelector('.zoom-in').addEventListener('click',()=>zoomBy(1.4));
    root.querySelector('.zoom-out').addEventListener('click',()=>zoomBy(0.72));
    root.querySelector('.like-btn').addEventListener('click',function(){ this.classList.toggle('liked'); });
    search.addEventListener('input',()=>applyQuery(search.value));
    root.querySelector('.search .clear').addEventListener('click',()=>{ search.value=''; applyQuery(''); });

    // mode switcher
    const descEl=root.querySelector('.modebar-desc'); descEl.textContent=DESC[mouseMode];
    function applyMode(m){
      mouseMode=m;
      root.querySelectorAll('.seg [data-m]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.m===m?'true':'false'));
      descEl.textContent=DESC[m];
      vel.x=vel.y=0; drift=0; swayOff.x=swayOff.y=0;
      if(m==='tour'){ tween=null; tourNext=1; }
      setCursor(); requestRender();
    }
    root.querySelectorAll('.seg [data-m]').forEach(b=>b.addEventListener('click',()=>applyMode(b.dataset.m)));

    // debug hooks
    if(location.search.includes('debug')){
      root.__select=(id)=>{ const a=byId.get(id); if(a) select(a); return !!a; };
      root.__setMode=applyMode;
      root.__moveMouse=(x,y)=>{ mouse.x=x; mouse.y=y; mouse.inside=true; updateHover(); requestRender(); };
      root.__state=()=>({mouseMode,cs:+cam.s.toFixed(3),cx:Math.round(cam.x),cy:Math.round(cam.y),hovered:hovered?hovered.d.t:null,tick:frameTick,similar:!!similarSeed});
      root.__overlap=()=>{ const vis=arts.filter(a=>a.targetDim>0.5); let worst=0;
        for(let i=0;i<vis.length;i++)for(let j=i+1;j<vis.length;j++){ const A=vis[i],B=vis[j],s=(A.size*1.06),t=(B.size*1.06);
          const ox=(s/2+t/2)-Math.abs(A.wx-B.wx), oy=(s/2+t/2)-Math.abs(A.wy-B.wy);
          if(ox>0&&oy>0) worst=Math.max(worst,Math.min(ox,oy)/Math.min(s,t)); }
        return +(worst*100).toFixed(1); };
    }

    const ro=new ResizeObserver(resize); ro.observe(root);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) requestRender(); });
    resize();
    // no entry screen — the cloud is live immediately, with a gentle intro drift that stops on first interaction
    drift = reduceMotion?0:0.08;
    if(!reduceMotion) setTimeout(()=>{ if(hint) hint.classList.add('gone'); },5000);
    else if(hint) hint.classList.add('gone');
    requestRender();
    return {resize};
  }

  Experience(document.querySelector('.exp'));
})();
</script>
</body>
</html>
