<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Advent calendar demo | LUMAS</title>
<!-- The demo for phones: opens the calendar on door 1 with the day switcher (demo builds only; the live build ignores ?day and ?demo). -->
<script>
  var q = new URLSearchParams(location.search);
  location.replace('../?day=' + (q.get('day') || '1') + '&demo' + (q.get('lang') === 'de' ? '&lang=de' : ''));
</script>
</head>
<body><noscript><a href="../?day=1&amp;demo">Open the demo</a></noscript></body>
</html>
